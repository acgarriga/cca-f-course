<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>{{title}} · CCAR-F</title>
<script>
  // Antes de pintar, para que no parpadee el tema. Misma clave que el examen 1.
  try { document.documentElement.setAttribute("data-theme", localStorage.getItem("examccarf-theme") || "light"); } catch (e) {}
</script>
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div id="progress"></div>
<button class="backdrop" id="backdrop" aria-label="Cerrar menú"></button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html">
      <div class="logo">A</div>
      <div>
        <h1>Guía CCAR-F</h1>
        <p>Claude Certified Architect – Foundations</p>
      </div>
    </a>
{{nav}}
    <div class="side-foot">
      <p>Generado desde los .md el {{date}}</p>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="Menú">☰</button>
      <span class="title">{{title}}</span>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn" title="Tema claro/oscuro">🌙</button>
      <button class="icon-btn" onclick="window.print()" title="Imprimir / PDF">⎙</button>
    </div>

    <main class="content prose{{contentClass}}">
{{content}}
{{pager}}
    </main>
  </div>
</div>
{{scripts}}
<script src="assets/app.js"></script>
</body>
</html>
