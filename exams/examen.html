      correct: "B", exp: "The interview pattern is designed to surface design considerations and uncover assumptions the developer may not have anticipated before any implementation begins. It is particularly valuable in domains like security where overlooked edge cases carry high risk. Option A bypasses the opportunity to surface gaps before implementation is locked in. Option C defers the discovery of design issues until after implementation, when the cost of changes is higher. Option D (test-driven iteration) is effective for well-defined behavior but cannot surface considerations the team has not yet thought of." },
    { domain: "d3", task: "3.5 · Iterative refinement", num: 49, q: "Claude Code generated a data transformation function that has three separate issues: an off-by-one error in a loop, a missing null check for an optional field, and an incorrect sort order. Each issue is in a completely different part of the function and none of them interact. What is the recommended approach for addressing these issues?",
      options: { A: "Report all three issues in a single detailed message so Claude has full context for all fixes at once.", B: "Fix them sequentially: address each issue in a separate message and verify the fix before moving to the next.", C: "Ask Claude to regenerate the entire function from scratch rather than patching the existing code.", D: "Address the off-by-one error and null check together since they are in loops, then fix the sort order separately." },
      correct: "B", exp: "When issues are independent, sequential iteration is appropriate: fixing each one separately and verifying the fix before moving on reduces the chance of fixes interfering with each other and makes each change easier to review. The guidance for sending all issues in a single message applies when the issues interact and Claude needs full context to resolve them together. Option A is suited to interacting problems, not independent ones. Option C discards working code unnecessarily. Option D creates an arbitrary grouping not based on actual interaction." },
    { domain: "d3", task: "3.5 · Iterative refinement", num: 51, q: "A developer has identified three issues in a data processing module: two logic bugs that interact because they both affect the same intermediate result, and a set of five inconsistent variable names scattered across multiple files. The logic bugs produce incorrect output only when both are present; the naming violations are independent style issues. How should these issues be addressed using iterative refinement?",
      options: { A: "Report all eight issues in a single message so Claude can resolve them together with full context.", B: "Send the two interacting logic bugs in one message so Claude can resolve them together, then address the naming violations sequentially in separate follow-up messages after verifying the bug fixes.", C: "Fix all naming violations first since they are simpler, then tackle the two logic bugs in a single message.", D: "Fix each of the eight issues in eight separate sequential messages, verifying each before proceeding." },
      correct: "B", exp: "The guidance for batching issues is based on whether they interact. The two logic bugs interact and Claude needs full context on both to resolve them correctly, so they should be reported together. The naming violations are independent and do not affect correctness, so sequential iteration is appropriate: fix each one and verify before moving to the next. Option A lumps all issues together, which adds noise when Claude is resolving the interacting bugs. Option C addresses ordering by complexity rather than by interaction. Option D applies sequential iteration to interacting bugs, which risks an incomplete fix." },
    { domain: "d3", task: "3.5 · Iterative refinement", num: 52, q: "A team is adding a caching layer to an existing microservice. The service was written two years ago by engineers who are no longer on the team, and its internal patterns for dependency injection and lifecycle management are unfamiliar to the current developer. Before writing any code, the developer wants to ensure Claude surfaces all relevant design considerations. Which iterative refinement technique is most appropriate?",
      options: { A: "Ask Claude to implement a generic Redis-based caching layer using standard patterns for the framework, then review its output for compatibility issues.", B: "Use the interview pattern: ask Claude to question you about the service's architecture, existing lifecycle hooks, and caching requirements before proposing any design.", C: "Provide the service's entry point files to Claude and ask it to generate a caching design document for review.", D: "Start with a minimal proof-of-concept cache for one endpoint and iterate by describing any failures encountered during testing." },
      correct: "B", exp: "The interview pattern is specifically designed for situations where the developer may not have anticipated all relevant design considerations. By asking Claude to question the developer about the service's patterns and constraints before implementing, it surfaces assumptions about lifecycle management, cache invalidation strategy, and dependency injection that the developer may not have known to specify upfront. Option A proceeds with generic patterns that may be incompatible with the unfamiliar service. Option C produces a design document but does not interactively surface considerations the developer has not yet thought of. Option D defers discovery to runtime failures rather than surfacing design issues before any code is written." },

    { domain: "d3", task: "3.6 · Claude Code in CI/CD", num: 10, q: "Your pipeline script runs `claude \"Analyze this pull request for security issues\"` but the job hangs indefinitely. Logs indicate Claude Code is waiting for interactive input. What's the correct approach?",
      options: { A: "Add the `-p` flag: `claude -p \"Analyze this pull request for security issues\"`", B: "Set the environment variable `CLAUDE_HEADLESS=true` before running the command", C: "Redirect stdin from `/dev/null`: `claude \"Analyze this pull request for security issues\" < /dev/null`", D: "Add the `--batch` flag: `claude --batch \"Analyze this pull request for security issues\"`" },
      correct: "A", exp: "The `-p` (or `--print`) flag is the documented way to run Claude Code in non-interactive mode. Options B and D reference non-existent features. Option C is a Unix workaround that doesn't properly address Claude Code's command syntax." },
    { domain: "d3", task: "3.6 · Claude Code in CI/CD", num: 50, q: "A CI pipeline runs Claude Code to generate test cases for each pull request. The team discovers that Claude is consistently suggesting test scenarios that already exist in the existing test files, wasting review time. Which approach in the CLAUDE.md configuration most directly addresses this problem?",
      options: { A: "Add the `-p` flag to the CI invocation command to prevent interactive prompts.", B: "Use `--output-format json` with `--json-schema` so that test suggestions are machine-parseable for deduplication.", C: "Document in `CLAUDE.md` the testing standards, available fixtures, and instruct Claude to review existing test files before suggesting new scenarios.", D: "Add a post-processing script to the pipeline that compares Claude's suggestions against the existing test files and filters duplicates." },
      correct: "C", exp: "Providing existing test files in context and documenting testing standards in `CLAUDE.md` directly instructs Claude to avoid duplicate suggestions at generation time. This is the most efficient fix because it addresses the root cause: Claude does not know what tests already exist. Option A prevents interactive hangs but does not affect test content. Option B improves parseability but does not prevent duplicate suggestions. Option D is a workaround that adds pipeline complexity without fixing the underlying issue." },
    { domain: "d3", task: "3.6 · Claude Code in CI/CD", num: 53, q: "A CI pipeline uses Claude Code to review pull requests and needs to post inline comments on specific lines in GitHub. The pipeline currently receives Claude's output as unstructured text, which requires a fragile regex parser to extract file paths, line numbers, and comment text. The parser breaks regularly as Claude's output format drifts between runs. What is the most robust solution?",
      options: { A: "Add stricter formatting instructions to the system prompt specifying the exact text structure expected, and add validation to reject any response that does not match.", B: "Use `--output-format json` combined with `--json-schema` to define a schema with `file`, `line`, and `comment` fields, so each finding is machine-parseable by construction.", C: "Add a post-processing step that uses a second Claude call to normalize the first response into a consistent structured format.", D: "Switch from inline comments to a single summary comment, which is easier to extract since it does not require line-level parsing." },
      correct: "B", exp: "Using `--output-format json` with `--json-schema` produces structured output that conforms to the defined schema by construction, eliminating format drift entirely. The pipeline can parse the JSON directly without a regex layer. Option A makes prompt instructions more rigid but still relies on Claude maintaining format consistency across runs, which is the root cause of the breakage. Option C adds latency and cost by introducing a second API call for normalization. Option D changes the feature behavior to work around the parsing problem rather than solving it." },

    // ---------------- Domain 4 ----------------
    { domain: "d4", task: "4.1 · Explicit criteria for precision", num: 55, q: "A CI code review prompt flags 60% of pull requests for \"potential security vulnerabilities.\" Developers have stopped reading the reports because nearly all flags are false positives on standard input validation patterns they consider acceptable. Adding \"only report high-confidence findings\" to the prompt has had no measurable effect. What is the most effective next step?",
      options: { A: "Replace the security review prompt with a rule-based static analysis tool that has zero false positives.", B: "Temporarily disable the security category and add explicit criteria defining which patterns constitute a reportable vulnerability versus acceptable practice, with concrete code examples for each.", C: "Increase the review model to a larger tier to improve its judgment on security issues.", D: "Add a post-processing confidence threshold: discard any finding where Claude rates its own confidence below 80%." },
      correct: "B", exp: "General instructions like \"only report high-confidence findings\" fail to reduce false positives because they do not define what counts as a positive. Temporarily disabling the noisy category restores developer trust immediately while explicit criteria with examples give Claude the specificity needed to distinguish real issues from acceptable patterns. Option A abandons the AI-based review entirely rather than fixing it. Option C is unlikely to change false positive rates when the root cause is imprecise criteria. Option D relies on self-reported confidence scores, which are poorly calibrated for LLMs." },
    { domain: "d4", task: "4.1 · Explicit criteria for precision", num: 56, q: "A Claude-based pull request reviewer raises \"magic number\" warnings on every numeric literal in the codebase, including well-understood constants like HTTP status codes and standard buffer sizes. Developers want magic numbers flagged only when they appear in business logic with no explanation. How should the prompt be updated?",
      options: { A: "Add an instruction to \"use good judgment about whether numbers are truly magic numbers.\"", B: "Define explicit criteria: flag numeric literals that appear in business logic calculations with no accompanying comment or named constant; exclude HTTP status codes, standard buffer sizes, and any value documented in a comment.", C: "Add a severity field to findings and instruct Claude to omit any finding with severity \"low.\"", D: "Provide a list of allowed numeric values that should never be flagged." },
      correct: "B", exp: "Explicit, specific criteria that define what to report and what to exclude are far more effective than general guidance or exclusion lists. Describing the precise conditions that make a number \"magic\" gives Claude a clear decision rule rather than requiring inference. Option A is the kind of vague instruction that causes the problem in the first place. Option C introduces a severity layer that does not address the underlying definitional problem. Option D would require maintaining an incomplete and fragile list that does not generalize to new values." },
    { domain: "d4", task: "4.1 · Explicit criteria for precision", num: 57, q: "A Claude-based code reviewer is generating inconsistent feedback on documentation quality: sometimes flagging missing docstrings for private helper functions, sometimes not; sometimes requiring full parameter descriptions, sometimes accepting one-line summaries. The team wants consistent, predictable documentation feedback on public API functions only. Which change most directly addresses the inconsistency?",
      options: { A: "Instruct Claude to \"apply documentation standards consistently and carefully.\"", B: "Define explicit documentation criteria: public API functions must have a docstring with a one-sentence summary, parameter descriptions, and return value description; private functions are excluded from documentation checks.", C: "Run three parallel review instances and accept feedback that appears in at least two of the three.", D: "Restrict the review prompt to only one concern at a time, alternating between security, documentation, and style in separate runs." },
      correct: "B", exp: "Explicit criteria that specify exactly what is required, for which functions, and at what level of detail eliminate the ambiguity that causes inconsistency. Without a clear definition of \"documented,\" Claude must infer the threshold each time, leading to variable results. Option A is the type of general instruction that already produces the problem. Option C adds overhead and suppresses legitimate feedback that may only appear in one instance. Option D separates concerns but does not fix the definition of what counts as adequate documentation." },

    { domain: "d4", task: "4.2 · Few-shot prompting", num: 58, q: "A team uses Claude to generate code review comments for pull requests. The comments are technically accurate but vary widely in format: some include file paths and line numbers, others are vague summaries, some use bullet points, and others write prose paragraphs. Developers want a consistent, actionable format: file path, line number, issue description, suggested fix. What is the most effective way to achieve this?",
      options: { A: "Add a format specification to the system prompt listing the required fields.", B: "Provide 2-4 few-shot examples in the prompt showing the exact desired output format for different types of issues, including file path, line number, issue description, and suggested fix.", C: "Use `--output-format json` and parse the results in a post-processing step to normalize format.", D: "Ask Claude to self-review its output and reformat any comment that does not match the required structure." },
      correct: "B", exp: "Few-shot examples demonstrating the exact desired output format are the most effective technique for achieving consistently formatted output when detailed instructions alone produce inconsistent results. Seeing concrete examples of the format makes the requirement unambiguous. Option A is a format specification that has likely already been tried given the problem description. Option C introduces parsing complexity and does not ensure consistent generation. Option D adds a round-trip that may still produce inconsistent intermediate output." },
    { domain: "d4", task: "4.2 · Few-shot prompting", num: 59, q: "A structured data extraction system is extracting contract clauses from legal documents. The model handles standard clauses well but consistently misclassifies ambiguous clauses that could fit two or more categories, such as a clause that contains both termination conditions and force majeure language. What few-shot prompting approach is most effective for improving accuracy on these edge cases?",
      options: { A: "Add more few-shot examples of standard, unambiguous clauses to reinforce the classification schema overall.", B: "Create targeted few-shot examples that specifically demonstrate ambiguous-case handling: showing the reasoning for why a clause with both termination and force majeure language belongs to one category and not the other.", C: "Switch from classification to extraction: ask Claude to extract the clause text without categorizing it, then apply a rule-based classifier.", D: "Add a confidence score field and route all low-confidence classifications to human review without attempting to improve the model's judgment." },
      correct: "B", exp: "Targeted few-shot examples for ambiguous scenarios that show the reasoning behind the classification decision are the most effective technique for improving handling of edge cases. Standard examples do not teach the model how to handle cases that span category boundaries. Option A reinforces behavior that already works rather than addressing the gap. Option C sidesteps the classification problem rather than solving it. Option D is a reasonable operational safeguard but does not improve model accuracy." },
    { domain: "d4", task: "4.2 · Few-shot prompting", num: 60, q: "A document extraction system uses Claude to pull financial figures from quarterly earnings reports. The reports have varied formats: some use tables, some use inline prose, some use both. Extraction accuracy for tabular data is high (94%) but prose-only documents show only 72% accuracy. What is the most targeted approach to improve prose extraction accuracy?",
      options: { A: "Increase the system prompt's emphasis on accuracy with stronger language and more detailed instructions.", B: "Add few-shot examples specifically showing correct extraction from prose-formatted documents, including cases where numbers appear in sentence form rather than tables.", C: "Pre-process all documents to convert prose financial data into table format before sending to Claude.", D: "Use a separate prompt for prose documents that instructs Claude to first identify all sentences containing numbers, then extract figures from those sentences only." },
      correct: "B", exp: "Few-shot examples demonstrating correct extraction from documents with varied formats directly address the accuracy gap on prose documents. The model already generalizes well to tabular data; the gap is in prose, and targeted examples for that format close the gap most efficiently. Option A relies on emphasis, which does not resolve structural pattern differences. Option C requires reliable pre-processing of arbitrarily structured prose, which is non-trivial. Option D adds complexity and may miss numbers that are discussed without appearing in sentences Claude isolates." },

    { domain: "d4", task: "4.3 · Structured output via tool use", num: 61, q: "Your extraction pipeline uses a prompt that requests JSON output with a code block. In production, approximately 3% of responses have JSON syntax errors: missing commas, unescaped characters, or truncated objects. These errors break your downstream parser and require manual reprocessing. What is the most reliable way to eliminate JSON syntax errors?",
      options: { A: "Add a validation step that re-runs the prompt if the output fails JSON parsing, up to 3 retries.", B: "Switch to tool use with a defined JSON schema as the input parameter; extract structured data from the `tool_use` response block.", C: "Add an instruction to the prompt: \"Your response must be valid JSON. Double-check for syntax errors before responding.\"", D: "Use a regex post-processor to fix the most common syntax errors before passing output to the parser." },
      correct: "B", exp: "Tool use with a JSON schema guarantees schema-compliant structured output by construction, eliminating syntax errors entirely. The model populates the tool call's input parameters according to the schema rather than generating free-text JSON. Option A reduces the frequency of failures but does not eliminate syntax errors. Option C relies on model self-checking, which does not provide the deterministic guarantee that tool use provides. Option D is a fragile workaround that cannot handle all syntax error patterns." },
    { domain: "d4", task: "4.3 · Structured output via tool use", num: 62, q: "Your structured data extraction pipeline processes invoices. You have two extraction tools: `extract_invoice_schema` and `extract_receipt_schema`. For each document, you do not know in advance which type it is. After switching to `tool_choice: \"auto\"`, you observe that 30% of the time the model returns a text description of what it found rather than calling either tool. What is the correct fix?",
      options: { A: "Set `tool_choice: \"any\"` to guarantee the model calls one of the available extraction tools without specifying which one.", B: "Set `tool_choice: {\"type\": \"tool\", \"name\": \"extract_invoice_schema\"}` to always call a specific tool.", C: "Add a system prompt instruction: \"Always call one of the extraction tools and never return text.\"", D: "Merge both schemas into a single `extract_document_schema` tool with an optional `document_type` field." },
      correct: "A", exp: "`tool_choice: \"any\"` guarantees the model calls a tool rather than returning conversational text, without requiring you to specify which tool. This is exactly the documented use case when you have multiple valid tools and want to ensure one is called. Option B forces a specific tool, which defeats the purpose when you do not know the document type in advance. Option C is a prompt-based approach with probabilistic compliance, which already failed as evidenced by the 30% text response rate. Option D is a valid architectural change but requires more engineering effort than a single configuration change." },

    { domain: "d4", task: "4.4 · Validation, retry & feedback loops", num: 63, q: "An invoice extraction pipeline uses tool use with a strict JSON schema. After validation, 8% of extracted invoices fail a business rule check: the sum of line item amounts does not equal the `total_amount` field. These are semantic errors, not schema syntax errors. The invoices are well-formed documents with no missing data. How should you implement the retry loop?",
      options: { A: "Retry up to 3 times with the same prompt; schema-compliant extraction will converge on a valid answer with additional attempts.", B: "On failure, append the original document, the failed extraction, and the specific validation error (\"line items sum to X but total_amount is Y\") to the follow-up prompt for model self-correction.", C: "Flag all invoices with this error as missing data and route them directly to human review without retry.", D: "Add a `calculated_total` field to the schema and populate it with the sum of line items in post-processing, then use the calculated total as the canonical value." },
      correct: "B", exp: "Retry-with-error-feedback works by giving the model the specific discrepancy it needs to self-correct. Since the invoices are well-formed and the data is present, the model has the information it needs to fix the arithmetic alignment on retry. Option A retries without feedback and is unlikely to improve results since the model will reproduce the same error. Option C routes to human review prematurely when a retry with feedback could resolve the issue. Option D silently replaces the model's extracted total with a calculated value, which could propagate errors if the line items themselves were extracted incorrectly." },
    { domain: "d4", task: "4.4 · Validation, retry & feedback loops", num: 64, q: "A CI code review pipeline is generating false positive findings at a high rate. The team wants to understand which specific code constructs are being flagged incorrectly so they can refine the prompt. The current findings output only includes `file`, `line`, and `description`. What schema change would best enable systematic false positive analysis?",
      options: { A: "Add a `confidence` field (0-100) to each finding so the team can filter by confidence threshold.", B: "Add a `detected_pattern` field to each finding that records the specific code construct or pattern that triggered the finding.", C: "Add a `category` field so findings can be grouped by issue type for aggregate analysis.", D: "Add an `is_false_positive` boolean field and instruct Claude to self-label its own false positives." },
      correct: "B", exp: "The `detected_pattern` field directly captures what code construct triggered each finding, enabling the team to identify which patterns produce the most false positives and update prompt criteria accordingly. Option A provides confidence scores but does not identify what prompted the finding. Option C allows grouping but not pattern-level debugging. Option D asks Claude to self-identify its own false positives, which is unreliable since the model cannot accurately distinguish true from false positives without ground truth." },
    { domain: "d4", task: "4.4 · Validation, retry & feedback loops", num: 67, q: "A financial document extraction pipeline is failing on the \"guarantor address\" field for a set of loan summaries. After 3 retry attempts with error feedback, the field still extracts as null. Each retry prompt includes the original document and the validation error. What should you investigate before scheduling further retries?",
      options: { A: "Increase the retry limit from 3 to 5, since complex field extraction may require more attempts to converge.", B: "Check whether the guarantor address is actually present in the loan summary document, or whether the document only references it by directing the reader to an external exhibit.", C: "Switch to a larger model tier for the retry attempts, since the current model may lack the reasoning capacity for this field.", D: "Restructure the schema to make the guarantor address field optional, allowing the pipeline to proceed when the field cannot be extracted." },
      correct: "B", exp: "Retries are only effective when the information needed to satisfy the validation is present in the document. A loan summary that references guarantor details in an external exhibit does not contain the address. No number of retries will extract information that is not in the input. Before adding retry cycles, validate that the target field is actually present in the source document. Option A adds more retries without diagnosing why the existing retries are failing. Option C may improve performance on difficult extractions but does not address absence of data. Option D removes the validation rather than diagnosing the root cause." },

    { domain: "d4", task: "4.5 · Batch processing strategies", num: 11, q: "Your team wants to reduce API costs. Two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes switching both to the Message Batches API for 50% cost savings. How should you evaluate this proposal?",
      options: { A: "Use batch processing for the technical debt reports only; keep real-time calls for pre-merge checks.", B: "Switch both workflows to batch processing with status polling to check for completion.", C: "Keep real-time calls for both workflows to avoid batch result ordering issues.", D: "Switch both to batch processing with a timeout fallback to real-time if batches take too long." },
      correct: "A", exp: "The Message Batches API has up to 24-hour processing times with no guaranteed latency SLA. This makes it unsuitable for blocking pre-merge checks but ideal for overnight batch jobs. Option B is wrong because relying on \"often faster\" completion isn't acceptable for blocking workflows. Option C reflects a misconception: batch results can be correlated using `custom_id` fields." },
    { domain: "d4", task: "4.5 · Batch processing strategies", num: 65, q: "A compliance team runs a weekly audit that analyzes 50,000 contract documents for regulatory clauses. The audit results are reviewed by a compliance analyst every Monday morning. The team is considering the Message Batches API. A colleague raises a concern: \"What if a batch fails partway through the 50,000 documents?\" How should partial batch failures be handled?",
      options: { A: "Always resubmit the entire batch; tracking partial failures adds implementation complexity.", B: "Use the `custom_id` field to correlate each request with its response, identify which documents returned error responses, and resubmit only those documents in a new batch.", C: "Set a shorter processing window timeout to force faster completion and reduce the risk of partial failures.", D: "Switch to real-time API calls with retry logic; the batch API is not suitable for mission-critical compliance workloads." },
      correct: "B", exp: "The `custom_id` field is specifically designed for correlating batch request and response pairs, enabling teams to identify which documents failed and resubmit only those, avoiding the cost of reprocessing the entire batch. Option A wastes 50% cost savings by reprocessing successful documents. Option C misunderstands the batch API; processing windows are managed by Anthropic and cannot be shortened on demand. Option D is overly conservative: the batch API is appropriate for non-blocking, latency-tolerant compliance audits, which this workflow is." },

    { domain: "d4", task: "4.6 · Multi-instance & multi-pass review", num: 12, q: "A pull request modifies 14 files across the stock tracking module. Your single-pass review produces inconsistent results: detailed feedback for some files, superficial comments for others, obvious bugs missed, and contradictory feedback. How should you restructure the review?",
      options: { A: "Split into focused passes: analyze each file individually for local issues, then run a separate integration-focused pass examining cross-file data flow.", B: "Require developers to split large PRs into smaller submissions of 3-4 files before the automated review runs.", C: "Switch to a higher-tier model with a larger context window to give all 14 files adequate attention in one pass.", D: "Run three independent review passes on the full PR and only flag issues that appear in at least two of the three runs." },
      correct: "A", exp: "Splitting reviews into focused passes directly addresses attention dilution. Option B shifts burden to developers without improving the system. Option C misunderstands that larger context windows don't solve attention quality issues. Option D would suppress detection of real bugs by requiring consensus on issues that may only be caught intermittently." },
    { domain: "d4", task: "4.6 · Multi-instance & multi-pass review", num: 66, q: "A developer generates a 300-line module using Claude Code in one session, then asks the same session to review the code for bugs. The review returns \"looks good\" with minor style suggestions but misses two logic errors that a colleague catches in manual review. What is the most likely cause, and what architectural change addresses it?",
      options: { A: "The context window was too large; the fix is to limit code generation to smaller chunks so the review has less to process.", B: "The reviewing instance retains reasoning context from generation, making it less likely to question its own decisions. Use a second independent Claude instance without the generation context to perform the review.", C: "The review prompt was too vague; adding more explicit review criteria to the same session would catch the missed errors.", D: "The model tier used for generation is more capable than the one used for review; switching both to the same tier resolves the quality gap." },
      correct: "B", exp: "Self-review limitation is a known pattern: when a model retains the reasoning context from code generation, it is less likely to identify errors in its own output. An independent review instance without the generator's context approaches the code without prior assumptions and catches issues the generating instance would overlook. Option A addresses context length, not reasoning context bias. Option C might improve detection of certain categories of issues but does not address the fundamental self-review limitation. Option D addresses model selection, not the structural problem of reviewing one's own output." },
    { domain: "d4", task: "4.6 · Multi-instance & multi-pass review", num: 68, q: "A developer builds a code generation pipeline where Claude generates a 200-line module, and then the same session reviews the generated code for correctness. The review returns only minor style suggestions and misses a logic error in the error handling path. A second developer reviewing the code manually finds the bug immediately. What architectural change would make the review phase more effective?",
      options: { A: "Add more explicit review criteria to the generation session's system prompt to help it catch logic errors.", B: "Use a second independent Claude instance without the generation context to perform the review, since the generating instance retains reasoning context that makes it less likely to question its own decisions.", C: "Run the review immediately after generation before any other tool calls accumulate in the context window.", D: "Switch to a larger model tier for the review step to improve reasoning quality." },
      correct: "B", exp: "When a model reviews code it generated in the same session, it retains the reasoning context from generation and is less likely to identify errors in its own output. An independent review instance approaches the code without prior assumptions and catches issues the generating instance overlooks. This is the documented rationale for multi-instance review architectures. Option A improves the review prompt but does not address the fundamental self-review limitation. Option C manages context length but does not remove the generator's retained reasoning bias. Option D improves general capability but does not change the structural problem of a model reviewing its own work." },

    // ---------------- Domain 5 ----------------
    { domain: "d5", task: "5.1 · Conversation context preservation", num: 69, q: "A customer support agent is handling a complex billing dispute that spans 20+ turns. A customer mentioned early in the conversation that they were charged $847.50 on March 3rd for a service they cancelled on February 28th. Midway through the conversation, the agent references the charge as \"the overcharge from last month\" without the specific amount. The customer disputes the agent's understanding of the case. What context management technique would prevent this?",
      options: { A: "Use `/compact` at the start of each conversation to summarize prior turns into a shorter representation.", B: "Extract transactional facts (amounts, dates, order numbers, statuses) into a persistent \"case facts\" block that is included at the beginning of every subsequent prompt in the conversation.", C: "Increase the model's context window by switching to a larger tier to retain the full conversation without summarization.", D: "Instruct the agent to re-read the full conversation history before each response." },
      correct: "B", exp: "Extracting precise transactional facts into a persistent \"case facts\" block ensures that specific numerical values, dates, and customer-stated details are explicitly available in every prompt turn rather than buried in growing conversation history. Progressive summarization risks condensing these details into vague references like \"overcharge from last month.\" Option A's compaction is useful for context length management but can lose precision on transactional facts. Option C does not prevent progressive summarization and is not a reliable solution. Option D is not practical for long conversations and still does not prevent facts from being lost as context grows." },
    { domain: "d5", task: "5.1 · Conversation context preservation", num: 70, q: "A multi-agent research pipeline aggregates findings from six subagents, each returning 800-1,200 tokens of raw tool output and reasoning. The synthesis agent receives all results in a single large message. The final report consistently omits or contradicts findings that appeared in the middle sections of the aggregated input. What is the most likely cause and the most effective mitigation?",
      options: { A: "The subagents are returning conflicting information; add a deduplication step before synthesis.", B: "The synthesis agent is hitting its output token limit; increase `max_tokens` to allow a longer response.", C: "The \"lost in the middle\" effect causes models to reliably process content at the beginning and end of long inputs but miss middle sections. Mitigate by placing key findings summaries at the beginning of aggregated inputs and organizing sections with explicit headers.", D: "The synthesis agent's context window is exhausted; route some subagent outputs through a secondary summarization agent before passing to synthesis." },
      correct: "C", exp: "The \"lost in the middle\" effect is a well-documented limitation where models attend less reliably to content in the middle of long inputs. Placing key findings at the beginning and using explicit section headers to organize the aggregated input significantly mitigates this effect. Option A addresses data consistency but not the positional attention problem. Option B addresses output length, not input attention. Option D adds pipeline complexity and may help with context length, but does not address the positional attention issue on its own." },

    { domain: "d5", task: "5.2 · Escalation & ambiguity resolution", num: 3, q: "Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates straightforward cases while attempting to autonomously handle complex situations requiring policy exceptions. What's the most effective way to improve escalation calibration?",
      options: { A: "Add explicit escalation criteria to your system prompt with few-shot examples demonstrating when to escalate versus resolve autonomously.", B: "Have the agent self-report a confidence score (1-10) before each response and automatically route requests to humans when confidence falls below a threshold.", C: "Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent begins processing.", D: "Implement sentiment analysis to detect customer frustration levels and automatically escalate when negative sentiment exceeds a threshold." },
      correct: "A", exp: "Adding explicit escalation criteria with few-shot examples directly addresses the root cause: unclear decision boundaries. Option B fails because LLM self-reported confidence is poorly calibrated. Option C is over-engineered. Option D solves a different problem entirely." },
    { domain: "d5", task: "5.2 · Escalation & ambiguity resolution", num: 71, q: "A customer opens a support chat saying \"I'd like to speak to a human please. I've been dealing with this billing issue for three weeks and I'm frustrated.\" The agent has already identified this as a standard billing adjustment that it can resolve in 2 steps using its available tools. Your agent responds by saying \"I can help with that right away, let me pull up your account.\" and proceeds to investigate. The customer repeats their request for a human. What is wrong with this behavior and what should be corrected?",
      options: { A: "The agent should honor an explicit customer request for a human agent immediately on first request, without attempting investigation first.", B: "The agent should detect negative sentiment and escalate once the frustration score exceeds a defined threshold.", C: "The agent should complete its investigation, present the proposed solution, and escalate only if the customer still insists afterward.", D: "The agent should apologize for the wait, then proceed with automated resolution since the case is within its capability." },
      correct: "A", exp: "When a customer explicitly requests a human agent, that request must be honored immediately regardless of whether the agent believes it can resolve the issue. Proceeding with investigation after a clear escalation request violates the design principle documented in Task 5.2. Option B introduces sentiment scoring as a proxy, but the customer has already expressed an explicit preference. Sentiment analysis is irrelevant here. Option C delays honoring the request while investigation proceeds, which further frustrates the customer. Option D is the agent's current incorrect behavior: capability is not the deciding factor when a customer has made an explicit request." },

    { domain: "d5", task: "5.3 · Error propagation across agents", num: 72, q: "Your web search subagent encounters a timeout while fetching results for a competitor analysis. The engineering team implements a change so the subagent catches the timeout internally and returns an empty result set with `status: \"success\"` and `results: []`. The coordinator receives this and the synthesis agent produces a report that is missing the competitive section entirely, with no indication anything went wrong. What is the problem with this approach?",
      options: { A: "Silently returning an empty success result prevents the coordinator from making any recovery decision and allows incomplete work to pass as complete output.", B: "The synthesis agent should be responsible for detecting empty sections and re-triggering the search subagent directly.", C: "The coordinator should always validate that each subagent returned non-empty results before proceeding to synthesis.", D: "The timeout threshold should be increased so that the subagent does not time out before returning real results." },
      correct: "A", exp: "Silently suppressing errors by returning empty results as success is an explicitly documented anti-pattern. It removes the coordinator's ability to recover, retry, or annotate output with coverage gaps. Option B incorrectly shifts the recovery responsibility to the synthesis agent, which lacks the tools and context to re-run searches. Option C adds coordinator-level validation as a safeguard, but it does not address the root cause: the subagent is misrepresenting failure as success. Option D addresses the symptom (timeout threshold) rather than the error propagation design flaw." },

    { domain: "d5", task: "5.4 · Context in large codebase exploration", num: 73, q: "An agent is performing a deep exploration of a 200,000-line legacy codebase to understand its payment processing flow. After approximately 90 minutes and dozens of file reads, the agent begins referencing \"standard patterns in payment systems\" rather than the specific classes and flows it found earlier, and its answers become inconsistent with findings from the first hour. What is the most likely cause and the best mitigation strategy?",
      options: { A: "The agent has reached a rate limit; the fix is to add delays between tool calls to stay within limits.", B: "Context degradation: as the session grows, specific findings from early in the session compete with general knowledge and the agent's position-attention effects. Mitigate by having the agent maintain a scratchpad file recording key findings throughout the session.", C: "The legacy codebase's file structure is too complex for a single agent; break it into independent subsystems and run separate agents on each subsystem simultaneously.", D: "The agent is using the wrong tools; switching from `Read` to `Grep` for file exploration would reduce context consumption." },
      correct: "B", exp: "Context degradation in extended sessions is a known pattern: models start giving inconsistent answers and referencing general knowledge rather than specific findings discovered earlier. Having the agent maintain a scratchpad file that records key findings creates a persistent, explicit record that can be referenced and included in subsequent prompts, preventing specific details from being lost to context pressure. Option A misidentifies the cause as a rate limit. Option C adds parallelism but does not address the single-session degradation problem. Option D changes tooling but does not address context growth or degradation." },
    { domain: "d5", task: "5.4 · Context in large codebase exploration", num: 74, q: "You are running a multi-phase codebase investigation using the Claude Agent SDK. After 45 minutes of exploration (reading files, tracing call chains, building a dependency map) you move into the second phase: identifying security vulnerabilities in the authentication module. You notice the agent is now describing the authentication module as \"using standard JWT patterns\" when earlier in the session it had found a custom token signing implementation. What technique would most effectively preserve key findings across these phase boundaries?",
      options: { A: "Have the agent maintain a scratchpad file that records key findings after each phase, and reference that file at the start of subsequent phases rather than relying on conversation history.", B: "Use `/compact` before starting the second phase to free up context space and allow the agent to re-read files as needed.", C: "Restart the session with a fresh context at the start of each phase, passing a manual summary of what you found.", D: "Increase the `max_tokens` parameter so the model can hold more context without compressing earlier findings." },
      correct: "A", exp: "Scratchpad files are the recommended technique for persisting key findings across context boundaries when context degradation becomes apparent. The agent can write structured notes during exploration and read them back at phase boundaries, ensuring critical findings, like the custom token signing implementation, are not lost to context compression. Option B uses `/compact` to free up space, but this compresses conversation history and may lose the specific finding about the custom token signing. Option C is a valid but costly approach: restarting sessions loses the accumulated understanding and requires manual intervention. Option D is incorrect because `max_tokens` controls output length, not context window size, and would not prevent the degradation." },

    { domain: "d5", task: "5.5 · Human review & confidence calibration", num: 75, q: "A structured data extraction system for insurance claims achieves 97% overall accuracy on a validation set. The team proposes automating the full workflow without human review. A colleague argues this aggregate metric masks important risks. What is the most important concern?",
      options: { A: "97% accuracy means 3% of claims will have errors, which could create legal liability if unchecked.", B: "Aggregate accuracy metrics can mask poor performance on specific document types or fields. A claim type or field category with 85% accuracy would be hidden by strong performance elsewhere, and stratified analysis is needed before automating.", C: "The validation set may not be representative of production data volumes, so the 97% figure cannot be trusted.", D: "Human review should always be retained regardless of accuracy metrics because automation of insurance decisions creates regulatory risk." },
      correct: "B", exp: "The core risk is that aggregate metrics can hide poor performance on specific segments. A document type with 85% accuracy on a critical field like `claim_amount` would be masked by strong performance across other document types. Before automating, accuracy should be validated by document type and field segment to confirm consistent performance across all dimensions. Option A is a valid concern but describes the error rate, not the masking risk. Option C raises a data quality concern but is not the most important concern about the specific 97% figure. Option D makes a policy argument that does not engage with the analytical gap identified." },
    { domain: "d5", task: "5.5 · Human review & confidence calibration", num: 76, q: "An extraction pipeline achieves high accuracy on average but the team wants to implement confidence-based routing: high-confidence extractions proceed automatically while low-confidence ones go to human review. A developer proposes using the model's stated confidence scores directly as the routing threshold. What is the critical flaw in this approach?",
      options: { A: "Confidence scores add tokens to every response, increasing API costs unnecessarily.", B: "Model confidence scores must be calibrated against a labeled validation set to determine what score threshold actually corresponds to acceptable accuracy. Uncalibrated raw scores are not reliable predictors of extraction correctness.", C: "Confidence scores only work when the model outputs a single extraction; multi-field documents require a different approach.", D: "Routing on confidence scores creates two separate code paths that are harder to maintain than a single uniform review workflow." },
      correct: "B", exp: "A model's raw confidence scores need calibration: without comparing stated confidence against actual correctness on a labeled validation set, there is no reliable mapping between a score of \"0.85\" and an acceptable error rate. Calibrating the threshold ensures that the routing cut-off corresponds to a known accuracy level. Option A is a minor operational concern, not a critical flaw. Option C is incorrect; confidence scores can be applied at the field level for multi-field documents. Option D is an engineering tradeoff, not a flaw in the confidence approach itself." },

    { domain: "d5", task: "5.6 · Provenance & multi-source synthesis", num: 77, q: "A research synthesis agent is combining findings from five subagents that searched different sources. The final report states that \"AI adoption in healthcare reached 45% in 2024\" but does not cite which source this came from. A reviewer cannot verify the claim because the subagents' individual outputs were not preserved. What structural change to the pipeline would prevent this provenance loss?",
      options: { A: "Require the synthesis agent to add a generic \"Sources consulted\" section at the end of the report listing all sources accessed.", B: "Require subagents to output structured claim-source mappings (claim text, source URL, document name, relevant excerpt) and instruct the synthesis agent to preserve and merge these mappings into the final report rather than summarizing them away.", C: "Store all raw subagent outputs in a separate log file so they can be consulted if a claim needs verification.", D: "Add a post-synthesis review step where a separate agent checks each claim in the report against the raw subagent outputs." },
      correct: "B", exp: "The root cause of provenance loss is that summarization steps compress findings without preserving claim-to-source mappings. Requiring subagents to output structured mappings and instructing the synthesis agent to preserve and merge them ensures that each claim in the final report carries its source attribution through the pipeline. Option A produces a list of sources consulted but does not link individual claims to specific sources. Option C stores raw data as a fallback but does not integrate provenance into the report itself. Option D adds a verification step after the fact but does not prevent the structural provenance loss." },
  ];

  // ---- Render helpers (texto seguro: escapa HTML y solo permite `code`) ----
  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function mdInline(str) {
    return escapeHtml(str).replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  function renderExam() {
    const root = document.getElementById("examRoot");
    const empty = document.getElementById("empty");
    if (!QUESTIONS.length) { empty.hidden = false; return; }
    empty.hidden = true;

    DOMAINS.forEach(dom => {
      const qs = QUESTIONS.filter(q => q.domain === dom.id);
      if (!qs.length) return;

      const section = document.createElement("section");
      section.className = "leccion";
      section.id = dom.id;
      section.dataset.code = dom.code;
      section.dataset.title = dom.title;
      section.dataset.count = qs.length;

      const kicker = document.createElement("span");
      kicker.className = "kicker";
      kicker.innerHTML = `${dom.code} · ${escapeHtml(dom.title)} <span class="dom">Peso ${dom.weight} · ${qs.length} preguntas</span>`;
      section.appendChild(kicker);

      const h1 = document.createElement("h1");
      h1.textContent = `Domain ${dom.code.slice(1)}: ${dom.title}`;
      section.appendChild(h1);

      const quiz = document.createElement("div");
      quiz.className = "quiz";
      quiz.dataset.lesson = dom.id;

      let lastTask = null;
      qs.forEach(q => {
        if (q.task !== lastTask) {
          const label = document.createElement("p");
          label.className = "task-label";
          label.textContent = "Task " + q.task;
          quiz.appendChild(label);
          lastTask = q.task;
        }

        const fs = document.createElement("fieldset");
        fs.className = "question";
        fs.id = "q-" + q.num;
        fs.dataset.correct = q.correct;
        fs.dataset.answered = "false";

        const legend = document.createElement("legend");
        legend.innerHTML = `<span class="qnum">Q${q.num}</span>` + mdInline(q.q);
        fs.appendChild(legend);

        const opts = document.createElement("div");
        opts.className = "options";
        ["A", "B", "C", "D"].forEach(letter => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option";
          btn.dataset.option = letter;
          btn.innerHTML = `${letter}. ` + mdInline(q.options[letter]);
          btn.addEventListener("click", () => answerQuestion(btn, q.exp));
          opts.appendChild(btn);
        });
        fs.appendChild(opts);

        const feedback = document.createElement("p");
        feedback.className = "feedback";
        feedback.setAttribute("aria-live", "polite");
        fs.appendChild(feedback);

        quiz.appendChild(fs);
      });

      const score = document.createElement("p");
      score.className = "quiz-score";
      score.setAttribute("aria-live", "polite");
      score.textContent = "0/" + qs.length + " correctas";
      quiz.appendChild(score);

      const reset = document.createElement("button");
      reset.className = "quiz-reset";
      reset.type = "button";
      reset.textContent = "Reiniciar dominio";
      reset.addEventListener("click", () => resetQuiz(quiz));
      quiz.appendChild(reset);

      section.appendChild(quiz);
      root.appendChild(section);
    });
  }

  // ---- Sidebar dinámico a partir de las <section class="leccion"> ----
  function buildNav() {
    const nav = document.getElementById("nav");
    const lessonCount = document.getElementById("lessonCount");
    const secciones = [...document.querySelectorAll(".leccion")];
    nav.innerHTML = "";
    lessonCount.textContent = `${secciones.length} dominios · ${QUESTIONS.length} preguntas`;
    secciones.forEach(sec => {
      const a = document.createElement("a");
      a.className = "lesson-btn";
      a.href = "#" + sec.id;
      a.innerHTML = `<span class="code">${sec.dataset.code || ""}</span><span class="txt">${sec.dataset.title || sec.id}</span><span class="cnt">${sec.dataset.count}</span>`;
      a.onclick = () => { setTimeout(() => toggleSidebar(false), 10); };
      nav.appendChild(a);
    });
  }

  // ---- Scroll spy ----
  function initSpy() {
    const links = [...document.querySelectorAll(".lesson-btn")];
    const map = new Map(links.map(l => [l.getAttribute("href").slice(1), l]));
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          links.forEach(l => l.classList.remove("active"));
          const link = map.get(e.target.id);
          if (link) link.classList.add("active");
        }
      });
    }, { rootMargin: "-40% 0px -55% 0px" });
    document.querySelectorAll(".leccion").forEach(s => obs.observe(s));
  }

  // ---- Barra de progreso de scroll ----
  window.addEventListener("scroll", () => {
    const h = document.documentElement;
    const pct = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    document.getElementById("progress").style.width = pct + "%";
  });

  // ---- Tema ----
  function toggleTheme() {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").textContent = next === "dark" ? "☀️" : "🌙";
    try { localStorage.setItem("examccarf-theme", next); } catch (e) {}
  }
  (function () {
    let t = "light";
    try { t = localStorage.getItem("examccarf-theme") || "light"; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("themeBtn").textContent = t === "dark" ? "☀️" : "🌙";
    });
  })();

  // ---- Sidebar móvil ----
  function toggleSidebar(force) {
    const sb = document.getElementById("sidebar");
    const bd = document.getElementById("backdrop");
    const open = force === undefined ? !sb.classList.contains("open") : force;
    sb.classList.toggle("open", open);
    bd.classList.toggle("show", open);
  }

  // ---- Preguntas interactivas ----
  function answerQuestion(button, explanation) {
    const question = button.closest(".question");
    if (question.dataset.answered === "true") return;
    const selected = button.dataset.option;
    const correct = question.dataset.correct;
    const isCorrect = selected === correct;
    question.dataset.answered = "true";
    question.querySelectorAll(".option").forEach(option => {
      option.disabled = true;
      if (option.dataset.option === correct) option.classList.add("correct");
    });
    if (!isCorrect) button.classList.add("incorrect");
    const feedback = question.querySelector(".feedback");
    feedback.innerHTML = (isCorrect ? "Correcto." : `No es correcto. La respuesta es ${correct}.`) +
      ` <span class="expl">${mdInline(explanation)}</span>`;
    feedback.className = `feedback ${isCorrect ? "ok" : "ko"}`;
    try {
      localStorage.setItem(`examccarf-${question.id}`, JSON.stringify({ selected, correct: isCorrect }));
    } catch (e) {}
    updateQuizScore(question.closest(".quiz"));
    updateGlobalScore();
  }

  function updateQuizScore(quiz) {
    const questions = [...quiz.querySelectorAll(".question")];
    const answered = questions.filter(q => q.dataset.answered === "true");
    const correct = answered.filter(q => q.querySelector(".option.incorrect") === null).length;
    quiz.querySelector(".quiz-score").textContent = `${correct}/${answered.length} correctas · ${questions.length - answered.length} pendientes`;
  }

  function updateGlobalScore() {
    const questions = [...document.querySelectorAll(".question")];
    const answered = questions.filter(q => q.dataset.answered === "true");
    const correct = answered.filter(q => q.querySelector(".option.incorrect") === null).length;
    document.getElementById("scoreText").innerHTML =
      `<strong>${answered.length}/${questions.length}</strong> respondidas · <strong>${correct}</strong> correctas`;
    const pct = questions.length ? (answered.length / questions.length) * 100 : 0;
    document.getElementById("scoreBar").style.width = pct + "%";
  }

  function resetQuiz(quiz) {
    quiz.querySelectorAll(".question").forEach(question => {
      question.dataset.answered = "false";
      question.querySelectorAll(".option").forEach(option => {
        option.disabled = false;
        option.classList.remove("correct", "incorrect");
      });
      const feedback = question.querySelector(".feedback");
      feedback.textContent = "";
      feedback.className = "feedback";
      try { localStorage.removeItem(`examccarf-${question.id}`); } catch (e) {}
    });
    updateQuizScore(quiz);
    updateGlobalScore();
  }

  function resetAll() {
    if (!confirm("¿Reiniciar las 77 preguntas? Se perderá el progreso guardado.")) return;
    document.querySelectorAll(".quiz").forEach(resetQuiz);
  }

  function initSavedAnswers() {
    document.querySelectorAll(".quiz").forEach(quiz => {
      quiz.querySelectorAll(".question").forEach(question => {
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(`examccarf-${question.id}`)); } catch (e) {}
        if (saved && saved.selected) {
          const option = question.querySelector(`[data-option="${saved.selected}"]`);
          if (option) option.click();
        }
      });
      updateQuizScore(quiz);
    });
    updateGlobalScore();
  }

  document.addEventListener("DOMContentLoaded", () => {
    renderExam();
    buildNav();
    initSpy();
    initSavedAnswers();
  });
</script>
</body>
</html>
