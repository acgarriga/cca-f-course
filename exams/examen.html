<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Simulacro · Claude Certified Architect Foundations</title>
<style>
  :root {
    --bg: #F0EEE6;
    --surface: #FAF9F5;
    --surface-2: #FFFFFF;
    --sidebar-bg: #EDEAE0;
    --text: #26241F;
    --text-soft: #55514A;
    --text-mute: #8A857A;
    --accent: #D97757;
    --accent-dark: #BE5D3D;
    --accent-soft: #F5E4DC;
    --border: #E0DCD0;
    --border-strong: #D2CCBD;
    --code-bg: #ECE9DF;
    --shadow: 0 1px 3px rgba(60,50,40,.06), 0 6px 24px rgba(60,50,40,.05);
    --radius: 14px;
  }
  [data-theme="dark"] {
    --bg: #1F1E1B;
    --surface: #262521;
    --surface-2: #2C2B26;
    --sidebar-bg: #1A1917;
    --text: #ECEAE3;
    --text-soft: #C4C0B6;
    --text-mute: #908B7F;
    --accent: #E0805F;
    --accent-dark: #D97757;
    --accent-soft: #3A2E28;
    --border: #38362F;
    --border-strong: #46443B;
    --code-bg: #2F2E28;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Avenir Next', Avenir, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased;
  }

  #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background: var(--accent); z-index: 100; transition: width .1s linear; }

  .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; min-height: 100dvh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--sidebar-bg); border-right: 1px solid var(--border);
    padding: 22px 16px; position: sticky; top: 0; height: 100vh; height: 100dvh;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 9px; flex: none; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px;
    box-shadow: 0 2px 8px rgba(217,119,87,.35);
  }
  .brand h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .brand p { margin: 1px 0 0; font-size: 11.5px; color: var(--text-mute); }

  .nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-mute); padding: 14px 10px 6px; font-weight: 600; }
  .lesson-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; background: transparent;
    border: 1px solid transparent; cursor: pointer; text-align: left; padding: 8px 10px;
    border-radius: 10px; margin-bottom: 2px; color: var(--text-soft); font-family: inherit;
    font-size: 13px; transition: all .13s ease; text-decoration: none;
  }
  .lesson-btn:hover { background: var(--surface-2); color: var(--text); }
  .lesson-btn.active { background: var(--accent-soft); color: var(--text); border-color: var(--border-strong); font-weight: 600; }
  .lesson-btn .code { font-family: Menlo, Monaco, monospace; font-size: 11px; font-weight: 600; color: var(--accent-dark); flex: none; width: 30px; }
  .lesson-btn.active .code { color: var(--accent); }
  .lesson-btn .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lesson-btn .cnt { flex: none; font-size: 10.5px; color: var(--text-mute); font-variant-numeric: tabular-nums; }

  .side-foot { margin-top: 16px; padding: 12px 10px; border-top: 1px solid var(--border); }
  .side-foot p { color: var(--text-mute); font-size: 12px; margin: 0 0 10px; }
  .side-foot button { width: 100%; }

  /* ---------- Main ---------- */
  .main { display: block; min-width: 0; width: 100%; }
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: 12px 32px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
  }
  .topbar .title { font-family: Georgia, 'Times New Roman', serif; font-size: 15px; font-weight: 600; }
  .lesson-count { color: var(--text-mute); font-size: 12px; }
  .spacer { flex: 1; }
  .icon-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-soft);
    width: 36px; height: 36px; border-radius: 9px; cursor: pointer; font-size: 16px;
    display: grid; place-items: center; transition: all .13s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .menu-btn { display: none; }

  .content { padding: 34px 48px 90px; max-width: 880px; margin: 0 auto; }
  @media (max-width: 720px) { .content { padding: 24px 20px 60px; } }

  /* ---------- Sección de dominio ---------- */
  .leccion { min-width: 0; overflow-wrap: anywhere; scroll-margin-top: 70px; padding-bottom: 30px; margin-bottom: 30px; border-bottom: 1px solid var(--border); }
  .leccion:last-of-type { border-bottom: none; }
  .leccion .kicker {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
    color: var(--accent-dark); background: var(--accent-soft); border: 1px solid var(--border-strong);
    padding: 4px 12px; border-radius: 20px; margin-bottom: 10px;
  }
  .leccion .kicker .dom { color: var(--text-mute); font-weight: 500; }
  .leccion h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; line-height: 1.25; margin: 6px 0 6px; font-weight: 600; }
  .leccion p.intro { margin: 6px 0 18px; color: var(--text-soft); }

  .leccion code { font-family: Menlo, Monaco, ui-monospace, monospace; font-size: 13px; background: var(--code-bg); padding: 2px 6px; border-radius: 6px; color: var(--text); }

  /* Preguntas de examen */
  .quiz { margin: 20px 0 8px; padding: 20px; border: 1px solid var(--border-strong); background: var(--surface-2); border-radius: var(--radius); box-shadow: var(--shadow); }
  .task-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-dark); margin: 26px 0 4px; }
  .task-label:first-child { margin-top: 0; }
  .question { min-width: 0; margin: 22px 0 0; padding: 20px 0 0; border: 0; border-top: 1px solid var(--border); }
  .question:first-of-type { padding-top: 0; border-top: 0; margin-top: 8px; }
  .question legend { width: 100%; padding: 0; color: var(--text); font-weight: 600; }
  .question legend .qnum { font-family: Menlo, Monaco, monospace; font-size: 12px; font-weight: 700; color: var(--accent-dark); margin-right: 6px; }
  .options { display: grid; gap: 8px; margin-top: 12px; }
  .option {
    min-height: 44px; width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); color: var(--text-soft); text-align: left;
    font: inherit; cursor: pointer; line-height: 1.45;
  }
  .option:hover, .option:focus-visible { border-color: var(--accent); outline: none; }
  .option.correct { border-color: #2e8b57; background: color-mix(in srgb, #4caf7d 14%, var(--surface-2)); color: var(--text); }
  .option.incorrect { border-color: #c0392b; background: color-mix(in srgb, #c0392b 10%, var(--surface-2)); color: var(--text); }
  .option:disabled { cursor: default; opacity: 1; }
  .feedback { min-height: 1.5em; margin: 10px 0 0; font-size: 14px; font-weight: 600; }
  .feedback .expl { display: block; font-weight: 400; color: var(--text-soft); margin-top: 4px; }
  .feedback.ok { color: #2e8b57; }
  .feedback.ko { color: #b03528; }
  .quiz-score { margin-top: 18px; color: var(--text-soft); font-size: 14px; }
  .quiz-reset { min-height: 44px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text-soft); font: inherit; cursor: pointer; }
  .quiz-reset:hover, .quiz-reset:focus-visible { border-color: var(--accent); color: var(--accent-dark); outline: none; }

  .scoreboard { position: sticky; top: 61px; z-index: 15; margin: 0 0 18px; padding: 12px 16px; border: 1px solid var(--border-strong); background: var(--surface-2); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--text-soft); }
  .scoreboard strong { color: var(--text); }
  .scoreboard .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--code-bg); overflow: hidden; }
  .scoreboard .bar > div { height: 100%; background: var(--accent); width: 0%; transition: width .2s ease; }

  .empty { text-align: center; padding: 80px 20px; color: var(--text-mute); }
  .empty .big { font-size: 46px; margin-bottom: 14px; }
  .empty h2 { font-family: Georgia, 'Times New Roman', serif; color: var(--text-soft); font-weight: 600; border: none; }

  .backdrop { display: none; border: 0; padding: 0; }
  @media (max-width: 1180px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; z-index: 60; width: min(380px, 86vw); padding-top: max(22px, env(safe-area-inset-top)); padding-bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-100%); transition: transform .22s ease; }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: grid; }
    .backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; }
    .topbar { padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right)); }
    .lesson-btn { min-height: 44px; }
    .icon-btn { width: 44px; height: 44px; }
  }
  @media print { .sidebar, .topbar, #progress, .scoreboard { display: none; } .app { grid-template-columns: 1fr; } .leccion { break-inside: avoid; } }
</style>
</head>
<body>
<div id="progress"></div>
<button class="backdrop" id="backdrop" onclick="toggleSidebar(false)" aria-label="Cerrar menú"></button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">📝</div>
      <div>
        <h1>Simulacro CCAR-F</h1>
        <p>77 preguntas · 5 dominios</p>
      </div>
    </div>
    <div class="nav-label">Dominios</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <p>Generado a partir de <code>Claude Certification Exam.md</code> · offline</p>
      <button class="quiz-reset" onclick="resetAll()">Reiniciar examen completo</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" onclick="toggleSidebar()" title="Menú">☰</button>
      <span class="title">Simulacro de examen</span>
      <span class="lesson-count" id="lessonCount"></span>
      <div class="spacer"></div>
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Tema claro/oscuro">🌙</button>
      <button class="icon-btn" onclick="window.print()" title="Imprimir / PDF">⎙</button>
    </div>

    <div class="content" id="content">
      <div class="scoreboard" id="scoreboard">
        <span id="scoreText"><strong>0/77</strong> respondidas · <strong>0</strong> correctas</span>
        <div class="bar"><div id="scoreBar"></div></div>
      </div>

      <div class="empty" id="empty" hidden>
        <div class="big">📝</div>
        <h2>No se pudo generar el examen</h2>
        <p>No se encontraron preguntas en los datos incrustados.</p>
      </div>

      <div id="examRoot"></div>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // Datos del examen (incrustados: abrir con file:// no puede
  // hacer fetch() del .md original por CORS, así que el contenido
  // se transcribe aquí como datos JS y se renderiza con DOM seguro).
  // ============================================================
  const DOMAINS = [
    { id: "d1", code: "D1", title: "Agentic Architecture & Orchestration", weight: "27%" },
    { id: "d2", code: "D2", title: "Tool Design & MCP Integration", weight: "18%" },
    { id: "d3", code: "D3", title: "Claude Code Configuration & Workflows", weight: "20%" },
    { id: "d4", code: "D4", title: "Prompt Engineering & Structured Output", weight: "20%" },
    { id: "d5", code: "D5", title: "Context Management & Reliability", weight: "15%" },
  ];

  const QUESTIONS = [
    // ---------------- Domain 1 ----------------
    { domain: "d1", task: "1.1 · Agentic loops", num: 1, q: "Production data shows that in 12% of cases, your agent skips `get_customer` entirely and calls `lookup_order` using only the customer's stated name, occasionally leading to misidentified accounts and incorrect refunds. What change would most effectively address this reliability issue?",
      options: { A: "Add a programmatic prerequisite that blocks `lookup_order` and `process_refund` calls until `get_customer` has returned a verified customer ID.", B: "Enhance the system prompt to state that customer verification via `get_customer` is mandatory before any order operations.", C: "Add few-shot examples showing the agent always calling `get_customer` first, even when customers volunteer order details.", D: "Implement a routing classifier that analyzes each request and enables only the subset of tools appropriate for that request type." },
      correct: "A", exp: "When a specific tool sequence is required for critical business logic, programmatic enforcement provides deterministic guarantees that prompt-based approaches cannot. Options B and C rely on probabilistic LLM compliance. Option D addresses tool availability rather than tool ordering." },
    { domain: "d1", task: "1.1 · Agentic loops", num: 13, q: "You are building a customer support agent using the Claude Agent SDK. The agent processes billing disputes by calling tools like `lookup_order`, `get_invoice`, and `process_refund`. A code review notes that after each tool call, your loop checks whether Claude's response text contains the phrase \"I have completed\" to decide whether to stop. What is the primary problem with this loop termination approach?",
      options: { A: "The agent will never terminate because `process_refund` always returns a success message that prevents \"I have completed\" from appearing.", B: "Relying on natural language signals in the assistant's text is unreliable; the correct approach is to inspect `stop_reason` and only terminate when it equals \"end_turn\".", C: "The loop should terminate as soon as any tool call fails, since continuing after a failure will corrupt the conversation history.", D: "Checking response text is only valid in synchronous mode; you must use a callback handler for proper loop control in async contexts." },
      correct: "B", exp: "Inspecting `stop_reason` is the canonical method for agentic loop control: continue iterating when `stop_reason` is \"tool_use\", stop when it is \"end_turn\". Natural language phrases like \"I have completed\" are not reliable termination signals because Claude's phrasing varies across responses and prompt updates. Options A and C are based on incorrect assumptions about how tools interact with response text. Option D conflates asynchronous execution patterns with loop control logic." },
    { domain: "d1", task: "1.1 · Agentic loops", num: 14, q: "A developer productivity agent investigates bug reports by calling `search_codebase`, `read_file`, and `run_tests`. During a code review, a colleague proposes adding an iteration cap: if the loop has not finished after 15 tool calls, terminate with a generic \"investigation incomplete\" response. What is the correct characterization of this design?",
      options: { A: "Iteration caps are the recommended primary stopping mechanism because they prevent runaway costs in production.", B: "Iteration caps are a reasonable safety boundary for long-running tasks but should not be the primary termination mechanism; `stop_reason: \"end_turn\"` remains the authoritative signal.", C: "The iteration cap should be replaced with a time-based timeout, since token counts are a more reliable measure of completion than iteration count.", D: "Iteration caps are unnecessary if the system prompt instructs the agent to always request only the minimum tools needed." },
      correct: "B", exp: "The agentic loop should terminate primarily when `stop_reason` equals \"end_turn\", which signals that the model has finished its task. An iteration cap can serve as a safety guardrail against runaway loops, but treating it as the primary stopping mechanism means the loop may cut off legitimate multi-step investigations. Options A and C misstate recommended practice. Option D conflates prompt-based guidance with loop control: even a well-prompted agent may legitimately need many tool calls for complex investigations." },
    { domain: "d1", task: "1.1 · Agentic loops", num: 15, q: "Your multi-agent research system's agentic loop appends each tool result to the conversation history before sending the next request. A teammate suggests instead storing all tool results in a separate database and providing only a summary to the model at each iteration, rather than the full result. Under what condition would this change most likely degrade agent performance?",
      options: { A: "When the tool results contain binary data such as images or file attachments.", B: "When the model needs to reason across multiple tool results simultaneously to determine its next action, since summaries may omit details required for that reasoning.", C: "When the number of tool calls per session exceeds 10, since larger histories slow down the API.", D: "When tools return results faster than 200ms, making history appending redundant." },
      correct: "B", exp: "The agentic loop depends on tool results being present in conversation history so the model can reason about what it has already discovered before deciding its next action. Summaries may omit field values, error codes, or conditional data the model needs to make correct decisions. Option A is a valid concern but not the primary performance risk for text-based research tasks. Options C and D are not recognized failure modes for this architecture." },

    { domain: "d1", task: "1.2 · Coordinator-subagent patterns", num: 7, q: "After running on \"impact of AI on creative industries,\" each subagent completes successfully but the final reports cover only visual arts, missing music, writing, and film production. The coordinator decomposed the topic into: \"AI in digital art creation,\" \"AI in graphic design,\" and \"AI in photography.\" What is the most likely root cause?",
      options: { A: "The synthesis agent lacks instructions for identifying coverage gaps in the findings it receives from other agents.", B: "The coordinator agent's task decomposition is too narrow, resulting in subagent assignments that don't cover all relevant domains.", C: "The web search agent's queries are not comprehensive enough and need to be expanded to cover more creative industry sectors.", D: "The document analysis agent is filtering out sources related to non-visual creative industries due to overly restrictive relevance criteria." },
      correct: "B", exp: "The coordinator's logs reveal the root cause directly: it decomposed \"creative industries\" into only visual arts subtasks. The subagents executed their assigned tasks correctly. The problem is what they were assigned." },
    { domain: "d1", task: "1.2 · Coordinator-subagent patterns", num: 16, q: "Your multi-agent research system uses a coordinator that always routes every query through all four subagents (web search, document analysis, synthesis, and report generation) regardless of query complexity. For a simple factual question like \"What year was the Anthropic API released?\", the system takes 45 seconds and incurs unnecessary cost. What design change most directly addresses this?",
      options: { A: "Replace the coordinator with a static routing table that maps query keywords to specific subagent pipelines.", B: "Have each subagent evaluate its own relevance to the current query and self-select into or out of the pipeline.", C: "Design the coordinator to dynamically select which subagents to invoke based on query complexity and type, rather than always routing through the full pipeline.", D: "Reduce the number of subagents from four to two by merging web search and document analysis into a single \"retrieval\" agent." },
      correct: "C", exp: "A coordinator that always runs the full pipeline regardless of query complexity wastes resources and adds latency for simple requests. The correct design is a coordinator that evaluates the query and selects only the subagents needed for that specific task. Option A replaces adaptive intelligence with a brittle keyword table. Option B distributes coordination logic across subagents, breaking the hub-and-spoke pattern and reducing observability. Option D reduces capability unnecessarily instead of improving routing logic." },
    { domain: "d1", task: "1.2 · Coordinator-subagent patterns", num: 17, q: "A coordinator agent in your research system has delegated document analysis to a subagent. After the subagent finishes, the coordinator notices the findings are incomplete: the subagent covered only three of the five specified sources. The coordinator needs to get the remaining two sources analyzed. What is the correct approach for re-delegating this work?",
      options: { A: "Invoke the synthesis agent with the partial findings and instruct it to infer what the missing sources likely contain based on patterns from the three completed analyses.", B: "The coordinator should re-invoke the document analysis subagent with an explicit prompt specifying only the two missing sources, including the previously completed findings as context.", C: "Send all five sources again to a new document analysis subagent instance, which will re-analyze the three already-completed sources along with the two missing ones.", D: "Let the coordinator generate its own analysis of the remaining two sources directly, rather than spawning another subagent delegation." },
      correct: "B", exp: "The coordinator's role includes evaluating output for gaps and re-delegating targeted work to close those gaps. Re-invoking the subagent with only the unfinished sources and providing the completed findings as context is efficient and correct. Option A asks synthesis to fabricate content, which undermines report accuracy. Option C wastes resources by re-processing already-completed sources. Option D bypasses the coordinator-subagent architecture and ignores the subagent's specialization." },

    { domain: "d1", task: "1.3 · Subagent invocation & context passing", num: 18, q: "You are building a coordinator that delegates research tasks to subagents using the `Task` tool. When you test the system, the coordinator cannot invoke any subagents. Reviewing the coordinator's `AgentDefinition`, you notice the `allowedTools` field is set to `[\"web_search\", \"read_document\"]`. What is the most likely cause of the failure?",
      options: { A: "The `Task` tool requires an explicit `subagent_endpoint` configuration before it can be invoked.", B: "\"Task\" is not included in the coordinator's `allowedTools`, so it cannot spawn subagents.", C: "The coordinator's system prompt does not include instructions to use the `Task` tool, so the model never attempts to call it.", D: "Subagent invocation requires the coordinator to be running in plan mode rather than direct execution mode." },
      correct: "B", exp: "The `Task` tool is the mechanism for spawning subagents in the Claude Agent SDK. For a coordinator to invoke subagents, \"Task\" must be explicitly included in its `allowedTools`. Simply having other tools available does not grant subagent spawning capability. Option A describes a configuration parameter that does not exist. Option C conflates prompt instructions with capability gating: even a well-prompted coordinator cannot call a tool that is not in its allowed set. Option D conflates plan mode with subagent spawning." },
    { domain: "d1", task: "1.3 · Subagent invocation & context passing", num: 19, q: "Your multi-agent research system has a web search subagent that consistently returns findings without identifying which sources correspond to which claims. When the synthesis agent receives these findings, it cannot produce properly cited reports. What is the correct fix during context passing from the web search subagent to the synthesis agent?",
      options: { A: "Instruct the synthesis agent to run its own web searches to re-locate the original sources.", B: "Use structured data formats that separate claim content from metadata (source URLs, publication dates, page numbers) in the subagent's output, and include this structure when passing context to the synthesis agent.", C: "Have the coordinator concatenate all subagent outputs into a single text block before forwarding to synthesis, since synthesis will extract citations naturally.", D: "Configure the web search subagent to return only source URLs, and have the synthesis agent re-read each source to reconstruct the findings." },
      correct: "B", exp: "Structured data formats that separate content from metadata ensure that claim-source mappings survive the handoff between agents. When context is passed as unstructured text, citation information is easily lost. Option A introduces redundant work and potentially different search results. Option C risks losing the claim-source associations during concatenation. Option D is extremely inefficient and requires the synthesis agent to redo retrieval work." },
    { domain: "d1", task: "1.3 · Subagent invocation & context passing", num: 20, q: "A coordinator needs to research three independent subtopics in parallel: market trends, competitor analysis, and regulatory environment. Each requires a separate web search subagent. How should the coordinator spawn these subagents to maximize throughput?",
      options: { A: "Spawn the subtopics sequentially: start the first subagent, wait for its result, then start the second, and so on, to avoid context conflicts.", B: "Emit all three `Task` tool calls in a single coordinator response, which allows the subagents to run in parallel.", C: "Route all three subtopics through a single subagent sequentially, sharing context between them to reduce total memory usage.", D: "Use a single subagent with three separate prompts in sequence, passing prior results as context for each subsequent prompt." },
      correct: "B", exp: "The Claude Agent SDK supports parallel subagent execution by emitting multiple `Task` tool calls in a single coordinator response. This maximizes throughput for independent subtopics that do not depend on each other's results. Option A introduces unnecessary serial latency. Option C assumes a dependency that the question does not establish. Option D collapses three specialists into one sequential process, eliminating parallelism." },

    { domain: "d1", task: "1.4 · Multi-step workflows & enforcement", num: 21, q: "Your customer support agent handles account closure requests. The workflow requires: (1) verify customer identity via `get_customer`, (2) check for active subscriptions via `check_subscriptions`, (3) process closure via `close_account`. Production logs show the agent occasionally calls `close_account` before completing the identity verification step, resulting in unauthorized account closures. A colleague suggests adding a system prompt instruction: \"Always verify identity before closing accounts.\" What is the most effective approach?",
      options: { A: "The system prompt instruction is sufficient because it explicitly describes the required order.", B: "Add few-shot examples showing the correct three-step sequence alongside the system prompt instruction.", C: "Implement a programmatic prerequisite that blocks `close_account` from executing until `get_customer` has returned a verified customer ID.", D: "Add a routing classifier that analyzes the request type and pre-selects the appropriate tools before the agent begins." },
      correct: "C", exp: "When a tool ordering requirement has serious consequences (unauthorized account closures), programmatic enforcement provides deterministic guarantees. Prompt instructions have a non-zero failure rate even when explicit. Option A relies on probabilistic compliance, which the logs already show is insufficient. Option B improves the odds but still does not guarantee compliance. Option D addresses tool selection rather than ordering enforcement." },
    { domain: "d1", task: "1.4 · Multi-step workflows & enforcement", num: 22, q: "A customer contacts your support agent about three issues in a single message: a billing charge dispute, a missing order, and a request to update their email address. The agent processes these sequentially, taking 3-4 minutes per request. A senior architect suggests you redesign the handling approach. What design change would most improve efficiency while maintaining accuracy?",
      options: { A: "Instruct the agent to address only the highest-priority issue per conversation turn and ask the customer to submit separate tickets for the remaining issues.", B: "Decompose the three concerns into distinct investigation items and process each in parallel using shared customer context, then compile a unified response.", C: "Process the three issues sequentially but cache intermediate results so subsequent issues benefit from data already retrieved.", D: "Delegate all three issues to a single specialized \"multi-issue\" subagent that handles complex requests with multiple concerns." },
      correct: "B", exp: "When a customer presents multiple independent concerns, decomposing them into parallel investigation items dramatically reduces latency. Each concern can be investigated simultaneously using the shared customer context already retrieved. Option A creates a poor customer experience and extra work for the customer. Option C improves caching but does not eliminate the serial bottleneck. Option D creates an undifferentiated subagent that doesn't reflect the coordinator-subagent specialization pattern." },

    { domain: "d1", task: "1.5 · Agent SDK hooks", num: 23, q: "Your customer support agent integrates with three backend MCP tools: a legacy billing system returning Unix timestamps, an order management system returning ISO 8601 dates, and a subscription service returning numeric status codes (1=active, 2=paused, 3=cancelled). The agent frequently misinterprets these heterogeneous formats when reasoning about customer records. What is the most appropriate architectural fix?",
      options: { A: "Update each backend system to return a uniform date and status format before the agent calls them.", B: "Add format conversion instructions to the system prompt explaining how to interpret each tool's output conventions.", C: "Implement `PostToolUse` hooks that intercept tool results from each source and normalize timestamps, dates, and status codes into a consistent format before the model processes them.", D: "Add a post-processing step after the agent produces its final response to re-format any dates and statuses that appear in the output." },
      correct: "C", exp: "`PostToolUse` hooks are the correct mechanism for intercepting and transforming tool results before the model processes them. This ensures the model always sees normalized data regardless of backend heterogeneity. Option A requires backend changes that may not be feasible and introduces coupling. Option B relies on probabilistic compliance and adds token overhead. Option D applies normalization after the model has already reasoned on inconsistent data, which cannot repair any incorrect conclusions already made." },
    { domain: "d1", task: "1.5 · Agent SDK hooks", num: 24, q: "Your customer support agent has a policy: refunds above $500 require manager approval and must not be processed autonomously. Your system prompt states \"Do not process refunds above $500 without manager approval.\" Production logs show this rule is violated in approximately 3% of cases. What is the most effective way to guarantee compliance?",
      options: { A: "Strengthen the system prompt language: \"You are strictly forbidden from processing refunds above $500 without explicit manager approval under any circumstances.\"", B: "Add 10 few-shot examples in the system prompt, all demonstrating the agent requesting manager approval for high-value refunds.", C: "Implement a hook that intercepts outgoing `process_refund` tool calls, checks the refund amount, and blocks execution or redirects to the manager approval workflow when the amount exceeds $500.", D: "Implement a validation step that runs after `process_refund` completes and reverses any refunds that exceeded the threshold." },
      correct: "C", exp: "Business rules that require guaranteed compliance must be enforced programmatically, not through prompt instructions alone. A hook that intercepts `process_refund` calls before execution provides deterministic enforcement regardless of how the model interprets the system prompt. Options A and B both improve adherence probabilistically but cannot guarantee zero violations. Option D runs after the action has already been taken, which means the policy violation has already occurred." },
    { domain: "d1", task: "1.5 · Agent SDK hooks", num: 25, q: "A developer productivity agent has a `PostToolUse` hook that transforms raw Bash output. Currently the hook appends a formatted summary but also preserves the full raw output in the result passed to the model. Sessions exploring large codebases are hitting context limits faster than expected. What change would most effectively reduce unnecessary context consumption from tool results?",
      options: { A: "Disable the `PostToolUse` hook entirely and let the model process raw Bash output directly.", B: "Modify the hook to return only the formatted summary to the model, trimming the verbose raw output rather than preserving it alongside the summary.", C: "Increase the model's `max_tokens` parameter to accommodate the additional context from both raw and formatted output.", D: "Switch from `PostToolUse` hooks to pre-processing the Bash commands themselves to produce shorter output." },
      correct: "B", exp: "`PostToolUse` hooks can trim verbose tool outputs to only the relevant data before the model processes them. Keeping both raw and summary output doubles the context consumption from each tool call. Modifying the hook to return only the formatted summary addresses the root cause directly. Option A removes normalization benefits. Option C increases output capacity but does not address the growing input context. Option D would require significant changes to tool invocation patterns and may not be feasible for all commands." },

    { domain: "d1", task: "1.6 · Task decomposition strategies", num: 26, q: "You are building an automated code review system using Claude. The review must cover three aspects for every pull request: security vulnerabilities, style compliance, and performance implications. Each aspect has clear, defined criteria documented in your engineering handbook. Which decomposition strategy is most appropriate?",
      options: { A: "Dynamic adaptive decomposition: have the agent start by scanning the full PR and generate a review plan based on what it finds.", B: "Prompt chaining with sequential focused passes: one pass per review aspect (security, style, performance), each with dedicated criteria.", C: "A single comprehensive pass that examines all three aspects simultaneously to capture cross-cutting concerns.", D: "Spawn three fully independent agents without shared context, then merge their outputs in a final aggregation step." },
      correct: "B", exp: "When a workflow has predictable, well-defined aspects that must each be covered, prompt chaining with sequential focused passes is the appropriate pattern. Each pass dedicates full attention to one concern rather than dividing attention across all three. Option A uses dynamic decomposition for a workflow whose structure is already known, adding unnecessary overhead. Option C suffers from the attention dilution problem that prompt chaining is designed to solve. Option D loses cross-file integration context by fully isolating the three agents." },
    { domain: "d1", task: "1.6 · Task decomposition strategies", num: 27, q: "An engineering team asks you to design a Claude-based system to investigate a production incident. The system must root-cause a bug that was introduced somewhere in the past two weeks across an unknown set of files and services. The scope of the investigation cannot be known in advance. Which decomposition approach is most appropriate?",
      options: { A: "Prompt chaining: design a fixed sequence of investigation steps (check logs, read configs, trace service calls) that the agent executes in order.", B: "Dynamic adaptive decomposition: the agent first maps the affected services and symptom timeline, then generates and prioritizes investigation subtasks based on what is discovered at each step.", C: "Split the investigation between two agents: one agent reads logs while the other reads source code, and they report findings independently to a human operator.", D: "Have the agent run a comprehensive search of all changed files in the past two weeks and produce a ranked list of candidates for manual review." },
      correct: "B", exp: "Open-ended investigation tasks with unknown scope require dynamic adaptive decomposition, where the agent builds its investigation plan based on intermediate findings rather than following a fixed sequence. A static prompt chain cannot adapt when the investigation reveals unexpected service dependencies or anomalous patterns. Option A is appropriate for predictable multi-aspect reviews, not exploratory investigations. Option C removes the coordinating intelligence and requires human intervention for synthesis. Option D is a single-pass heuristic that does not apply the model's reasoning capability." },

    { domain: "d1", task: "1.7 · Session state & resumption", num: 28, q: "A developer has been using Claude Code to investigate a legacy authentication service. After several hours, they have built up a detailed session with findings about the service's token validation logic. They need to step away and return tomorrow. Three core files in the authentication module will be modified overnight by another team. What is the most reliable approach for resuming the investigation productively the next day?",
      options: { A: "Resume the named session with `--resume <session-name>` and notify the agent about the specific files that were changed, so it can re-analyze those files in the context of its prior understanding.", B: "Start a completely new session each time, since stale tool results from the previous session make resumption unreliable for any scenario.", C: "Resume the named session without any notification about file changes; the agent will detect modifications automatically when it next reads those files.", D: "Use `fork_session` to create a branch of the current session before stepping away, then resume from the fork the next day." },
      correct: "A", exp: "When resuming a session after code modifications, the correct approach is to use `--resume <session-name>` to continue the named session and explicitly inform the agent about which files changed so it can target re-analysis appropriately. Option B is overly conservative: starting fresh is appropriate when prior tool results are broadly stale, but when only a few known files changed, resumption with targeted context about those changes is more efficient. Option C is incorrect because the agent does not automatically detect file changes on resume. Option D misuses `fork_session`, which is designed for exploring divergent approaches from a shared baseline, not for session continuity across time gaps." },
    { domain: "d1", task: "1.7 · Session state & resumption", num: 29, q: "You are leading a research investigation using Claude Code. You have completed an initial analysis of a competitor's public API documentation and want to explore two divergent architectural approaches for your response strategy: one focused on feature parity, one focused on differentiation. You want both explorations to start from the same analysis baseline. Which session management approach best fits this scenario?",
      options: { A: "Run two separate new sessions, each with a copy of the analysis findings injected as context in the initial prompt.", B: "Use `--resume` to resume the current session twice in parallel, once for each exploration direction.", C: "Use `fork_session` to create two independent branches from the current session, then explore each approach in its respective branch.", D: "Continue in the same session, exploring one approach, then using `/compact` to clear context before exploring the second approach." },
      correct: "C", exp: "`fork_session` is designed precisely for this scenario: creating independent branches from a shared analysis baseline to explore divergent approaches. Each branch inherits the common findings and can be explored independently without contaminating the other. Option A requires duplicating context and does not preserve the live session state. Option B describes a mechanism that does not work this way: `--resume` continues a single session sequentially, not in parallel branches. Option D uses `/compact` destructively, losing the baseline context needed for the second exploration." },

    // ---------------- Domain 2 ----------------
    { domain: "d2", task: "2.1 · Tool interface design", num: 2, q: "Production logs show the agent frequently calls `get_customer` when users ask about orders, instead of calling `lookup_order`. Both tools have minimal descriptions and accept similar identifier formats. What's the most effective first step to improve tool selection reliability?",
      options: { A: "Add few-shot examples to the system prompt demonstrating correct tool selection patterns, with 5-8 examples.", B: "Expand each tool's description to include input formats it handles, example queries, edge cases, and boundaries explaining when to use it versus similar tools.", C: "Implement a routing layer that parses user input before each turn and pre-selects the appropriate tool based on detected keywords.", D: "Consolidate both tools into a single `lookup_entity` tool that accepts any identifier and internally determines which backend to query." },
      correct: "B", exp: "Tool descriptions are the primary mechanism LLMs use for tool selection. Option B directly addresses the root cause. Few-shot examples (A) add token overhead without fixing the underlying issue. A routing layer (C) is over-engineered. Consolidating tools (D) requires more effort than a \"first step\" warrants." },
    { domain: "d2", task: "2.1 · Tool interface design", num: 30, q: "Your customer support agent has a `lookup_order` tool that is called at the right times, but frequently returns errors. Logs show the agent passes free-text descriptions like \"order from last Tuesday\" instead of the required ISO-8601 timestamp format. The tool description reads: \"Retrieves order details given a date or identifier.\" No examples or format constraints are provided. What change to the tool definition would most directly reduce these input format errors?",
      options: { A: "Add input format constraints, accepted value formats, and example inputs to the tool description so the model knows exactly how to format its calls.", B: "Add a system prompt instruction: \"Always use ISO-8601 format when calling lookup_order.\"", C: "Add input schema validation that rejects malformed inputs and returns an error to the agent.", D: "Split `lookup_order` into two tools: `lookup_order_by_id` and `lookup_order_by_date` to reduce ambiguity." },
      correct: "A", exp: "Tool descriptions are the primary mechanism the model uses to understand how to call a tool. Adding format constraints and examples directly to the description gives the model the information it needs at decision time. Option B adds token overhead in the system prompt but is more fragile than a tool-specific description. Option C adds validation but does not prevent the model from sending malformed inputs in the first place, creating unnecessary error cycles. Option D addresses a different problem (disambiguation) rather than the format guidance issue." },
    { domain: "d2", task: "2.1 · Tool interface design", num: 31, q: "Your customer support agent has three tools with overlapping names and descriptions: `get_account_info` (\"Get information about the account\"), `fetch_account_details` (\"Fetch account details\"), and `retrieve_customer_record` (\"Retrieve customer information\"). All three call different backend systems with different data. The agent frequently picks the wrong tool. Which approach most effectively resolves the misrouting?",
      options: { A: "Add a system prompt instruction listing all three tools and specifying exactly when each should be used based on the request type.", B: "Rename the tools to reflect their distinct data sources and rewrite their descriptions to explain what data each returns, what backend it queries, and what use case it serves.", C: "Consolidate all three tools into one tool with a `source` parameter that specifies which backend to query.", D: "Keep the current tools but randomize which one the agent calls, then merge the responses in a post-processing step." },
      correct: "B", exp: "Ambiguous or overlapping tool names and descriptions cause misrouting. Renaming tools to reflect their distinct backends and writing descriptions that explain what each one returns, where its data comes from, and when to use it are the right fixes. Option A may reduce misrouting but does not fix the root problem: the tool descriptions themselves are indistinguishable. Option C collapses three specialized tools into one generic tool with a parameter, which shifts the burden of correct routing back to the model in a less structured way. Option D is not a viable architecture." },

    { domain: "d2", task: "2.2 · Structured error responses", num: 8, q: "The web search subagent times out while researching a complex topic. You need to design how this failure information flows back to the coordinator agent. Which error propagation approach best enables intelligent recovery?",
      options: { A: "Return structured error context to the coordinator including the failure type, the attempted query, any partial results, and potential alternative approaches.", B: "Implement automatic retry logic with exponential backoff within the subagent, returning a generic \"search unavailable\" status only after all retries are exhausted.", C: "Catch the timeout within the subagent and return an empty result set marked as successful.", D: "Propagate the timeout exception directly to a top-level handler that terminates the entire research workflow." },
      correct: "A", exp: "Structured error context gives the coordinator the information it needs to make intelligent recovery decisions. Option B's generic status hides valuable context. Option C suppresses the error, preventing any recovery. Option D terminates the entire workflow unnecessarily." },
    { domain: "d2", task: "2.2 · Structured error responses", num: 32, q: "Your customer support MCP tool `process_refund` returns the same error response for all failures: `{\"status\": \"error\", \"message\": \"Operation failed\"}`. The agent currently handles all errors by apologizing to the customer and ending the conversation. Logs show this response is triggered by: network timeouts, invalid refund amounts, refunds blocked by fraud detection, and expired order IDs. What structured error response design would most improve the agent's ability to recover appropriately?",
      options: { A: "Return different HTTP status codes for each failure type and have the agent interpret the status code to determine recovery action.", B: "Return structured error metadata including `errorCategory` (transient/validation/permission/business), `isRetryable` boolean, and a human-readable explanation specific to the failure reason.", C: "Return a verbose error log with the full stack trace and system state so the agent has maximum information to reason from.", D: "Return a numeric error code and have the system prompt map each code to a recovery action." },
      correct: "B", exp: "Structured error metadata gives the agent the information it needs to choose the correct recovery path: retry a transient failure, ask the customer for corrected input on a validation failure, or explain a policy block on a business rule violation. Option A relies on HTTP semantics that may not map cleanly to all failure categories and are not as expressive as structured fields. Option C provides excessive detail that consumes context without improving decision quality. Option D encodes recovery logic in the system prompt rather than in a principled error structure, making it harder to maintain." },
    { domain: "d2", task: "2.2 · Structured error responses", num: 33, q: "A web search subagent in your research system calls `search_web` and receives the following response: `{\"results\": [], \"status\": \"success\"}`. The subagent reports to the coordinator: \"Web search was successful but no relevant results were found.\" Later you discover the search API was actually down and returning empty results for all queries. What change to the MCP tool's error handling would prevent this confusion?",
      options: { A: "Always return a non-empty results array by including fallback content when the actual search returns nothing.", B: "Distinguish between access failures (where the backend could not be reached or returned an error) and valid empty results (where the search succeeded but found no matches), using the `isError` flag for the former.", C: "Add a `confidence` field to the response so the agent can infer whether the empty result is a real outcome or a failure.", D: "Implement automatic retry in the MCP tool itself, so the agent never sees an empty result unless all retries were exhausted." },
      correct: "B", exp: "Access failures and valid empty results are fundamentally different conditions that require different agent responses. Using the `isError` flag for access failures while returning `{\"results\": [], \"status\": \"success\"}` only for genuine empty-result queries gives the coordinator accurate information to make retry and recovery decisions. Option A masks failures by fabricating content. Option C introduces ambiguity; a confidence score on a genuinely empty result is meaningless. Option D handles retries locally but does not solve the agent's inability to distinguish the two conditions." },
    { domain: "d2", task: "2.2 · Structured error responses", num: 34, q: "Your MCP tool `check_fraud_risk` returns `{\"isError\": true, \"message\": \"Refund blocked\"}` when a refund is flagged by fraud detection. The agent interprets this as a transient failure and retries the refund three times before giving up. Each retry generates a separate fraud alert in your compliance system. What is the missing element in the error response design?",
      options: { A: "The response should include a `retry_after` timestamp so the agent knows when to retry.", B: "The response should include `isRetryable: false` and a customer-appropriate explanation distinguishing this business rule block from a transient system error.", C: "The tool should suppress the `isError` flag for fraud blocks and instead return the result as a successful response with a `blocked: true` field.", D: "The response should include the fraud risk score so the agent can decide whether the score is high enough to justify blocking." },
      correct: "B", exp: "A business rule block from fraud detection is a non-retryable error. Including `isRetryable: false` signals to the agent that retrying will not resolve the situation, preventing redundant attempts that trigger compliance alerts. A customer-appropriate explanation helps the agent communicate the block appropriately. Option A implies the block is temporary and retriable, which is the opposite of the intended behavior. Option C hides the error nature of the response and makes recovery logic less clear. Option D provides fraud risk data to the agent that it may not be authorized to act on directly." },

    { domain: "d2", task: "2.3 · Tool distribution & tool_choice", num: 9, q: "The synthesis agent frequently needs to verify specific claims while combining findings. Currently, this creates 2-3 round trips per task, increasing latency by 40%. 85% of verifications are simple fact-checks; 15% require deeper investigation. What's the most effective approach to reduce overhead while maintaining reliability?",
      options: { A: "Give the synthesis agent a scoped `verify_fact` tool for simple lookups, while complex verifications continue delegating to the web search agent through the coordinator.", B: "Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end of its pass.", C: "Give the synthesis agent access to all web search tools so it can handle any verification need directly without round-trips.", D: "Have the web search agent proactively cache extra context around each source during initial research, anticipating what the synthesis agent might need to verify." },
      correct: "A", exp: "Option A applies the principle of least privilege by giving the synthesis agent only what it needs for the 85% common case while preserving the existing coordination pattern for complex cases. Option B creates blocking dependencies. Option C over-provisions the synthesis agent. Option D relies on speculative caching." },
    { domain: "d2", task: "2.3 · Tool distribution & tool_choice", num: 35, q: "You are building a multi-agent research system with a synthesis agent whose sole job is combining findings from subagents and producing a structured report. You have given the synthesis agent access to all 18 tools in your system: web search, file reading, database queries, email sending, calendar access, and more, reasoning that more tools provide more flexibility. What problem does this configuration most likely introduce?",
      options: { A: "The synthesis agent will refuse to call any tools because it is overwhelmed by the number of choices.", B: "Having access to tools outside its specialization increases the likelihood the synthesis agent will misuse them, such as initiating new web searches instead of synthesizing the provided findings.", C: "18 tools will exceed the context window limit for tool schemas, causing API errors on every request.", D: "The additional tools will slow down the synthesis agent because the model must read all tool descriptions before producing output." },
      correct: "B", exp: "Giving an agent access to tools outside its specialization degrades tool selection reliability. A synthesis agent with web search tools will sometimes initiate new searches rather than working with the findings already provided, breaking the intended workflow. Option A overstates the effect: the agent will still call tools, but may call the wrong ones. Option C is not a realistic failure mode for 18 tools with typical schema sizes. Option D mischaracterizes how tool descriptions affect latency." },
    { domain: "d2", task: "2.3 · Tool distribution & tool_choice", num: 36, q: "Your customer support system requires that every response from the `draft_response` agent includes a structured JSON summary before the agent returns its output. You want to guarantee the agent calls the `generate_summary` tool on every invocation, not optionally. Which `tool_choice` configuration achieves this?",
      options: { A: "Set `tool_choice: \"auto\"` so the model decides when the summary tool is needed.", B: "Set `tool_choice: \"any\"` so the model must call at least one tool, though it may choose a different tool instead.", C: "Set `tool_choice: {\"type\": \"tool\", \"name\": \"generate_summary\"}` to force the model to call `generate_summary` specifically.", D: "Remove all other tools from the agent's tool list so `generate_summary` is the only option available." },
      correct: "C", exp: "Forced tool selection via `tool_choice: {\"type\": \"tool\", \"name\": \"generate_summary\"}` guarantees the model calls that specific tool on every invocation. Option A (\"auto\") allows the model to return text without calling any tool. Option B (\"any\") guarantees a tool call but does not guarantee which tool, so the model might choose a different one. Option D achieves the same result indirectly but removes legitimate tools the agent may need for its other tasks." },

    { domain: "d2", task: "2.4 · MCP server integration", num: 37, q: "Your team is setting up a shared GitHub MCP server for all engineers on a project. The server requires a GitHub API token for authentication. You want every engineer who clones the repository to have the MCP server available without each person having to manually configure it, and you want to avoid committing the actual token to version control. What is the correct configuration approach?",
      options: { A: "Add the MCP server to `~/.claude.json` on each developer's machine with their personal token hardcoded.", B: "Add the MCP server to the project-scoped `.mcp.json` file with the token specified using environment variable expansion (e.g., `${GITHUB_TOKEN}`), and commit `.mcp.json` to the repository.", C: "Add the MCP server configuration to the root `CLAUDE.md` file under a `[mcp_servers]` section.", D: "Create a setup script that each developer runs once to add the MCP server to their personal `~/.claude.json` with their token." },
      correct: "B", exp: "Project-scoped `.mcp.json` with environment variable expansion is the correct pattern for shared MCP servers: it is committed to the repository so all team members get the configuration automatically, and tokens are injected via environment variables at runtime rather than committed as plaintext. Option A requires manual per-person setup and hardcodes tokens. Option C describes a configuration mechanism that does not exist in CLAUDE.md. Option D also requires manual setup and does not solve the commit-to-version-control problem." },
    { domain: "d2", task: "2.4 · MCP server integration", num: 38, q: "A developer productivity agent frequently makes multiple exploratory tool calls to discover what data sources are available in your MCP server before it can answer user questions. This pattern increases latency and consumes context for routine requests. What MCP feature most directly addresses this discovery overhead?",
      options: { A: "Add a `list_tools` meta-tool to the MCP server that returns all available tool names and descriptions.", B: "Expose content catalogs as MCP resources, giving the agent visibility into available data at connection time rather than through exploratory tool calls.", C: "Reduce the number of tools in the MCP server by merging similar tools together to minimize the discovery surface.", D: "Add a caching layer that stores the results of previous exploratory calls and reuses them across sessions." },
      correct: "B", exp: "MCP resources are designed to expose content catalogs so agents know what data is available without making exploratory tool calls. This gives the agent upfront visibility at connection time, reducing the need for repeated discovery queries. Option A would still require a tool call to discover available resources. Option C reduces functionality to avoid a structural problem. Option D addresses symptom rather than cause, and cross-session caching of content catalogs may return stale data." },

    { domain: "d2", task: "2.5 · Built-in tools", num: 39, q: "A developer productivity agent needs to find all TypeScript files in a project that import from a deprecated module named `legacy-auth`. The project has thousands of files across many directories. Which combination of built-in tools is most appropriate for this task?",
      options: { A: "Use `Bash` to run `find . -name \"*.ts\"` and then `Bash` again to run `grep` on each file found.", B: "Use `Glob` to find all `.ts` files, then use `Read` to open each file and check whether it contains the import.", C: "Use `Grep` to search for the import pattern across all TypeScript files in the codebase.", D: "Use `Read` on the project root directory to get a file listing, then recursively `Read` each subdirectory." },
      correct: "C", exp: "`Grep` is the correct built-in tool for searching file contents across a codebase. It efficiently searches all TypeScript files for the import pattern without requiring separate file enumeration. Option A uses Bash shell commands that should be replaced by dedicated tools when those tools are available. Option B uses `Glob` for enumeration and then `Read` on each file, which is far less efficient than `Grep` for a content search. Option D uses `Read` for directory traversal, which is not a supported use of that tool." },
    { domain: "d2", task: "2.5 · Built-in tools", num: 40, q: "A developer productivity agent needs to update a configuration value in a file. The value appears in a block of code that contains several nearly identical lines. When the agent uses `Edit`, the tool returns an error: \"Match not unique: found 3 occurrences of the target text.\" What is the correct fallback approach?",
      options: { A: "Use `Bash` to run a `sed` command to replace all occurrences of the target text simultaneously.", B: "Use `Read` to load the full file contents, identify the exact surrounding context needed to make the edit unique, and retry `Edit` with a larger `old_string` that uniquely identifies the correct location.", C: "Use `Write` to overwrite the entire file with a corrected version, based on the contents loaded by `Read`.", D: "Use `Grep` to locate the line number of each occurrence, then use `Edit` with a line number parameter to target the correct one." },
      correct: "B", exp: "When `Edit` fails due to non-unique text, the correct first step is to use `Read` to examine the full file and find enough surrounding context to construct a unique `old_string`. This is more surgical than a full `Write` overwrite. Option C using `Read + Write` is a valid fallback but should only be used when `Edit` still cannot find a unique anchor even with additional context. Option A uses Bash shell commands when built-in tools should be preferred, and would replace all occurrences rather than targeting the correct one. Option D describes a line number parameter that `Edit` does not support." },

    // ---------------- Domain 3 ----------------
    { domain: "d3", task: "3.1 · CLAUDE.md hierarchy & scoping", num: 41, q: "A senior engineer adds detailed coding standards and security guidelines to their `~/.claude/CLAUDE.md` file. When a new team member joins and clones the repository, they report that Claude Code behaves differently and does not appear to follow the team's documented standards. What is the most likely cause?",
      options: { A: "The new team member's Claude Code version is outdated and does not support shared configuration files.", B: "The `~/.claude/CLAUDE.md` file is user-scoped and not version-controlled, so teammates do not receive it when they clone the repository.", C: "CLAUDE.md files must be placed in the `.claude/` subdirectory to be recognized; a root-level `CLAUDE.md` is ignored.", D: "The configuration hierarchy requires the project-level file to explicitly import from user-level files using `@import`." },
      correct: "B", exp: "User-level configuration in `~/.claude/CLAUDE.md` applies only to the individual developer and is never committed to version control. Teammates will not see it regardless of their setup. To share standards across the team, those instructions must live in the project-level `CLAUDE.md` or `.claude/CLAUDE.md`, which are committed to the repository. Options A and D describe mechanisms that do not exist. Option C is incorrect because a root-level `CLAUDE.md` is a valid project-level location." },
    { domain: "d3", task: "3.1 · CLAUDE.md hierarchy & scoping", num: 42, q: "Your monorepo has a root `CLAUDE.md` that has grown to over 400 lines, covering Python conventions, TypeScript conventions, infrastructure rules, and testing standards. Developers report that Claude sometimes applies the wrong conventions to the wrong files, and the file is difficult to maintain. What is the best approach to reorganize this configuration?",
      options: { A: "Split the content into multiple files in `.claude/rules/`, with each file covering a focused topic, and use path-scoped YAML frontmatter to activate rules only for relevant files.", B: "Create a separate `CLAUDE.md` in each top-level package directory and delete the root file entirely.", C: "Add inline section headers to the monolithic file and use the `/memory` command to tell Claude which section to prioritize for each task.", D: "Break the root `CLAUDE.md` into topic files and use `@import` directives in the root file to pull them all in unconditionally." },
      correct: "A", exp: "The `.claude/rules/` directory is designed for exactly this scenario: organizing topic-specific rule files with YAML frontmatter path scoping so each rule set activates only when editing relevant files. This reduces irrelevant context and token usage. Option B would require duplicating shared rules across package directories. Option C relies on manual intervention each session and is not maintainable. Option D with unconditional `@import` addresses the maintenance concern but not the wrong-conventions problem, since all rules would still load regardless of context." },
    { domain: "d3", task: "3.1 · CLAUDE.md hierarchy & scoping", num: 54, q: "You maintain a monorepo with five packages: a Python backend, a TypeScript frontend, a Go service, shared infrastructure Terraform, and a documentation site. Each package has different linting standards, testing conventions, and framework-specific rules. The root `CLAUDE.md` has grown to 600 lines and developers report that rules intended for one package often bleed into sessions working on another. What is the most modular and maintainable solution using CLAUDE.md configuration?",
      options: { A: "Create a `CLAUDE.md` in each package directory with that package's rules, and use `@import` in the root `CLAUDE.md` to include shared conventions that apply to all packages.", B: "Keep the 600-line root file but add explicit section headers and instruct developers to tell Claude which section applies at the start of each session.", C: "Delete the root `CLAUDE.md` and rely entirely on package-level files, accepting that shared conventions must be duplicated across packages.", D: "Move all rules into `.claude/rules/` files and tag each with a `projects:` key in their frontmatter specifying which subdirectory the rule applies to." },
      correct: "A", exp: "The `@import` syntax in CLAUDE.md is designed for exactly this modular pattern: shared conventions in the root file, package-specific rules in each package's own `CLAUDE.md`, with the root file importing common standards that apply globally. This keeps each file focused and maintainable while eliminating rule bleed between packages. Option B relies on developer discipline to manually scope rules each session, which is error-prone and does not scale. Option C eliminates the shared baseline and requires duplicating common conventions across five files, creating maintenance drift. Option D is a valid approach for path-scoped rules within a single project but does not address the need for package-level CLAUDE.md isolation." },

    { domain: "d3", task: "3.2 · Custom slash commands & skills", num: 4, q: "You want to create a custom `/review` slash command that runs your team's standard code review checklist and should be available to every developer when they clone or pull the repository. Where should you create this command file?",
      options: { A: "In the `.claude/commands/` directory in the project repository", B: "In `~/.claude/commands/` in each developer's home directory", C: "In the `CLAUDE.md` file at the project root", D: "In a `.claude/config.json` file with a `commands` array" },
      correct: "A", exp: "Project-scoped custom slash commands are stored in `.claude/commands/` within the repository, version-controlled and automatically available to all developers. Option B is for personal, non-shared commands. Option C is for project instructions, not command definitions. Option D describes a mechanism that doesn't exist." },
    { domain: "d3", task: "3.2 · Custom slash commands & skills", num: 43, q: "A developer wants a `/scaffold` skill that generates boilerplate for a new microservice. The skill runs many exploratory file reads and Bash commands to understand existing patterns before generating output, producing hundreds of lines of intermediate output. Teammates complain this pollutes their main conversation context. Which frontmatter setting resolves this?",
      options: { A: "Set `allowed-tools: []` in the skill's frontmatter to prevent tool use during execution.", B: "Set `context: fork` in the skill's frontmatter to run the skill in an isolated sub-agent context that does not affect the main session.", C: "Move the skill file from `.claude/skills/` to `.claude/commands/` so it runs as a command rather than a skill.", D: "Add `argument-hint: \"service-name\"` to the frontmatter so the skill receives a clean input without inheriting session context." },
      correct: "B", exp: "The `context: fork` frontmatter option runs the skill in an isolated sub-agent context. All exploratory output, intermediate tool calls, and reasoning happen in the fork and do not accumulate in the main conversation context. Only the final output is returned to the parent session. Option A would disable the tool use the skill depends on. Option C does not change execution isolation behavior. Option D is for prompting the user for input parameters, unrelated to output isolation." },

    { domain: "d3", task: "3.3 · Path-specific rules", num: 6, q: "Your codebase has distinct areas with different conventions. Test files are spread throughout the codebase alongside the code they test. You want all tests to follow the same conventions regardless of location. What's the most maintainable way to ensure Claude automatically applies the correct conventions when generating code?",
      options: { A: "Create rule files in `.claude/rules/` with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths.", B: "Consolidate all conventions in the root `CLAUDE.md` file under headers for each area, relying on Claude to infer which section applies.", C: "Create skills in `.claude/skills/` for each code type that include the relevant conventions in their `SKILL.md` files.", D: "Place a separate `CLAUDE.md` file in each subdirectory containing that area's specific conventions." },
      correct: "A", exp: "`.claude/rules/` with glob patterns (e.g., `**/*.test.tsx`) allows conventions to be automatically applied based on file paths regardless of directory location. Option B relies on inference rather than explicit matching. Option C requires manual invocation. Option D can't easily handle files spread across many directories." },
    { domain: "d3", task: "3.3 · Path-specific rules", num: 44, q: "Your team uses Terraform for infrastructure but only in the `infra/` directory. You want Claude to automatically apply Terraform naming conventions and module structure rules only when editing `.tf` files, without those rules appearing in unrelated Python or TypeScript sessions. What is the correct approach?",
      options: { A: "Create a `CLAUDE.md` file inside `infra/` that contains the Terraform rules so they apply only within that subdirectory.", B: "Create a rules file in `.claude/rules/terraform.md` with YAML frontmatter specifying `paths: [\"infra/**/*\"]` and listing the Terraform conventions.", C: "Add the Terraform rules to the root `CLAUDE.md` under a clearly marked section, and instruct Claude in the system prompt to apply them only to `.tf` files.", D: "Create a skill in `.claude/skills/terraform.md` with `allowed-tools` restricted to file operations on the `infra/` directory." },
      correct: "B", exp: "The `.claude/rules/` directory with YAML frontmatter path scoping is the correct mechanism for conditionally loading conventions. Setting `paths: [\"infra/**/*\"]` ensures the Terraform rules load only when editing files in that directory tree. Option A would work for files inside `infra/` but cannot use glob patterns to further filter by file type. Option C relies on Claude's inference rather than explicit path matching, leading to inconsistent behavior. Option D requires manual skill invocation and does not activate automatically." },

    { domain: "d3", task: "3.4 · Plan mode vs direct execution", num: 5, q: "You've been assigned to restructure a monolithic application into microservices. This will involve changes across dozens of files and requires decisions about service boundaries and module dependencies. Which approach should you take?",
      options: { A: "Enter plan mode to explore the codebase, understand dependencies, and design an implementation approach before making changes.", B: "Start with direct execution and make changes incrementally, letting the implementation reveal the natural service boundaries.", C: "Use direct execution with comprehensive upfront instructions detailing exactly how each service should be structured.", D: "Begin in direct execution mode and only switch to plan mode if you encounter unexpected complexity during implementation." },
      correct: "A", exp: "Plan mode is designed for complex tasks involving large-scale changes, multiple valid approaches, and architectural decisions. Option B risks costly rework when dependencies are discovered late. Option C assumes you already know the right structure without exploring the code. Option D ignores that the complexity is already stated." },
    { domain: "d3", task: "3.4 · Plan mode vs direct execution", num: 45, q: "A developer asks Claude Code to add a single null-check to one function in a utility module. The function signature, expected behavior, and fix are all clear. Should they use plan mode or direct execution?",
      options: { A: "Plan mode, because any code change could have unexpected side effects that need exploration before committing.", B: "Direct execution, because the task is well-scoped with a clear fix that does not require architectural decisions or multi-file analysis.", C: "Plan mode, because exploring the codebase first prevents Claude from making assumptions about dependencies.", D: "Use direct execution first, but run a quick plan mode scan afterward to catch any side effects before committing." },
      correct: "B", exp: "Direct execution is appropriate for simple, well-understood, single-location changes with clear scope. Plan mode is designed for tasks involving large-scale changes, multiple valid approaches, architectural decisions, or multi-file modifications. A null-check to one function meets none of the criteria for plan mode. Options A and C describe an over-cautious heuristic that does not reflect the intended use of plan mode. Option D inverts the correct workflow: plan mode is used before execution to explore and decide, not after as a post-execution check." },
    { domain: "d3", task: "3.4 · Plan mode vs direct execution", num: 46, q: "A developer is using plan mode to explore a large codebase before deciding how to approach a library migration. During exploration, Claude generates dozens of tool results including full file reads, search outputs, and dependency traces. The developer notices the main conversation context is filling up rapidly and fears context exhaustion before the plan is complete. What is the most appropriate technique to preserve main session context during verbose exploration?",
      options: { A: "Switch to direct execution partway through exploration so that Claude uses fewer tool calls.", B: "Use the Explore subagent to isolate verbose discovery output, having it return a structured summary to the main session rather than accumulating raw results.", C: "Run `/compact` immediately after each tool call to keep the context window from growing.", D: "Restrict Claude to reading only entry point files during plan mode to limit tool call volume." },
      correct: "B", exp: "The Explore subagent is specifically designed to isolate verbose discovery work from the main conversation context. It performs the exploration and returns a structured summary, preventing raw tool results from consuming the main session's context budget. Option A abandons the architectural exploration prematurely. Option C helps but running `/compact` after every tool call is operationally cumbersome and loses detail that may still be needed. Option D artificially limits the exploration and would produce an incomplete analysis for complex migrations." },

    { domain: "d3", task: "3.5 · Iterative refinement", num: 47, q: "A developer asks Claude Code to reformat date strings in a data pipeline. After the first attempt, the output format is partially correct but inconsistent: some dates are formatted as `YYYY-MM-DD`, others as `MM/DD/YYYY`. Prose instructions like \"always use ISO 8601\" have been tried twice without improvement. What technique is most likely to resolve the inconsistency?",
      options: { A: "Rewrite the instruction to be more emphatic, using capitalization and repetition to signal importance.", B: "Provide 2-3 concrete input/output examples showing the exact transformation expected, including edge cases like two-digit years and ambiguous formats.", C: "Switch to plan mode so Claude can explore the codebase before formatting dates.", D: "Ask Claude to generate a formatting function first, then apply it in a second pass." },
      correct: "B", exp: "Concrete input/output examples are the most effective way to communicate expected transformations when prose instructions are interpreted inconsistently. Showing \"3/15/2024\" -> \"2024-03-15\" is unambiguous in a way that \"use ISO 8601\" is not. Option A is unlikely to improve results; emphasis does not resolve ambiguity. Option C is for architectural decisions, not formatting refinement. Option D adds complexity and still does not clarify what the correct transformation looks like." },
    { domain: "d3", task: "3.5 · Iterative refinement", num: 48, q: "A development team is using Claude Code to implement a new authentication module. Before any implementation begins, the team lead wants to ensure Claude surfaces potential security considerations, edge cases, and design tradeoffs that the team may not have anticipated. Which iterative refinement technique is most appropriate here?",
      options: { A: "Write a detailed specification document and pass it to Claude for direct implementation.", B: "Use the interview pattern: ask Claude to question the team about their requirements, constraints, and assumptions before proposing a design.", C: "Start with a minimal implementation and iterate by describing issues found during code review.", D: "Provide a complete test suite first and ask Claude to write code that passes all tests." },
